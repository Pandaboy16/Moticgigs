<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">

  <title>Available Tasks - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #16a34a;
      color: white;
      padding: 18px;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .back-btn {
      background: white;
      color: #16a34a;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 5px;
    }

    .task-card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      border: 1px solid #e5e7eb;
    }

    .task-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .task-info {
      color: #555;
      margin: 7px 0;
      font-size: 15px;
    }

    .reward {
      color: #16a34a;
      font-weight: bold;
      font-size: 18px;
      margin-top: 12px;
    }

    .start-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }

    .workspace {
      display: none;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
      border: 2px solid #16a34a;
    }

    .workspace-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .step {
      background: #f5f7f6;
      padding: 15px;
      border-radius: 11px;
      margin-bottom: 15px;
    }

    .step-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .open-task-btn {
      display: block;
      text-align: center;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
      margin-top: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      margin-top: 8px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #16a34a;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      background: white;
      margin-top: 8px;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 12px;
      border: 1px solid #ddd;
    }

    .submit-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .cancel-btn {
      width: 100%;
      background: #eee;
      color: #333;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      color: #777;
      background: white;
      border-radius: 14px;
      padding: 30px 15px;
    }

    .message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }

    .comment-box {
      background: #fff;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      MoticGigs
    </div>

    <button
      class="back-btn"
      onclick="window.location.href='dashboard.html'">

      ← Dashboard

    </button>

  </div>

</header>


<div class="container">

  <h1>Available Tasks</h1>

  <p>
    Complete advertiser tasks and earn rewards.
  </p>

  <div id="message" class="message"></div>

  <div id="taskList">

    <div class="empty">
      Loading available tasks...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;


/* ==========================================
   INITIALIZE
========================================== */

async function initialize() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href = "login.html";

    return;
  }


  currentUser = user;


  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("Moticgigs")
    .select("role,status")
    .eq("Id", user.id)
    .single();


  if (
    profileError ||
    !profile ||
    String(profile.role).toLowerCase() !== "worker"
  ) {

    document.getElementById("message").textContent =
      "Only worker accounts can access available tasks.";

    document.getElementById("message").className =
      "message error";

    return;
  }


  if (profile.status === "banned") {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

    return;
  }


  await loadTasks();

}


/* ==========================================
   LOAD AVAILABLE TASKS
========================================== */

async function loadTasks() {

  const taskList =
    document.getElementById("taskList");


  taskList.innerHTML =
    '<div class="empty">Loading available tasks...</div>';


  /*
    IMPORTANT:

    We deliberately load ALL submissions made
    by this worker.

    We do NOT filter by PENDING or APPROVED.

    This means even a REJECTED submission
    permanently hides that task from this worker.
  */

  const {
    data: mySubmissions,
    error: submissionError
  } = await supabaseClient
    .from("Submission")
    .select("task_id")
    .eq("worker_id", currentUser.id);


  if (submissionError) {

    console.error(
      "Submission loading error:",
      submissionError
    );

    taskList.innerHTML =
      '<div class="empty">Unable to load your submissions.</div>';

    return;
  }


  /*
    Create a list of every task this worker
    has ever submitted.
  */

  const submittedTaskIds =
    new Set(
      (mySubmissions || [])
        .map(row => row.task_id)
    );


  /*
    Load active tasks.
  */

  const {
    data: tasks,
    error: taskError
  } = await supabaseClient
    .from("Task")
    .select(`
      id,
      platform,
      task_type,
      task_link,
      custom_comment,
      quantity,
      completed_quantity,
      price_per_action,
      worker_reward,
      status,
      created_at
    `)
    .eq("status", "ACTIVE")
    .order("created_at", {
      ascending: false
    });


  if (taskError) {

    console.error(
      "Task loading error:",
      taskError
    );

    taskList.innerHTML =
      '<div class="empty">Unable to load available tasks.</div>';

    return;
  }


  /*
    Show ONLY tasks where:

    1. Task is ACTIVE
    2. Task still has slots
    3. Worker has NEVER submitted it before
  */

  const availableTasks =
    (tasks || []).filter(task => {

      const remaining =
        Number(task.quantity || 0) -
        Number(task.completed_quantity || 0);


      const workerAlreadySubmitted =
        submittedTaskIds.has(task.id);


      return (
        remaining > 0 &&
        !workerAlreadySubmitted
      );

    });


  if (availableTasks.length === 0) {

    taskList.innerHTML =
      '<div class="empty">No available tasks right now.</div>';

    return;
  }


  taskList.innerHTML = "";


  availableTasks.forEach(task => {

    const remaining =
      Number(task.quantity || 0) -
      Number(task.completed_quantity || 0);


    const card =
      document.createElement("div");

    card.className =
      "task-card";


    card.innerHTML = `

      <div class="task-title">
        ${escapeHtml(task.platform)}
        - ${escapeHtml(task.task_type)}
      </div>

      <div class="task-info">
        Available slots:
        <b>${remaining}</b>
      </div>

      <div class="task-info">
        Price per action:
        <b>
          ₦${Number(
            task.price_per_action || 0
          ).toFixed(2)}
        </b>
      </div>

      <div class="reward">
        Worker reward:
        ₦${Number(
          task.worker_reward || 0
        ).toFixed(2)}
      </div>

      ${
        task.custom_comment
        ? `
          <div class="task-info">

            Custom comment:

            <div class="comment-box">
              ${escapeHtml(
                task.custom_comment
              )}
            </div>

          </div>
        `
        : ""
      }


      <button
        class="start-btn"
        onclick="openWorkspace('${task.id}')">

        Start Task

      </button>


      <div
        id="workspace-${task.id}"
        class="workspace">


        <div class="workspace-title">
          Complete This Task
        </div>


        <!-- STEP 1 -->

        <div class="step">

          <div class="step-title">
            Step 1 — Open the advertiser's task
          </div>

          <div>
            Perform the required action on the platform.
          </div>

          <a
            class="open-task-btn"
            href="${escapeAttribute(task.task_link)}"
            target="_blank"
            rel="noopener">

            🔗 Open Task

          </a>

        </div>


        <!-- STEP 2 -->

        <div class="step">

          <div class="step-title">
            Step 2 — Enter your username
          </div>

          <div>
            Enter the username you used to complete the task.
          </div>

          <input
            type="text"
            id="username-${task.id}"
            placeholder="Enter your username"
            maxlength="100">

        </div>


        <!-- STEP 3 -->

        <div class="step">

          <div class="step-title">
            Step 3 — Upload screenshot proof
          </div>

          <div>
            Upload a screenshot showing that you completed the task.
          </div>

          <input
            type="file"
            id="proof-${task.id}"
            accept="image/*"
            onchange="previewProof('${task.id}')">

          <img
            id="preview-${task.id}"
            class="preview">

        </div>


        <!-- SUBMIT -->

        <button
          class="submit-btn"
          id="submit-${task.id}"
          onclick="submitTask('${task.id}')">

          Submit Task

        </button>


        <button
          class="cancel-btn"
          onclick="closeWorkspace('${task.id}')">

          Cancel

        </button>


      </div>

    `;


    taskList.appendChild(card);

  });

}


/* ==========================================
   OPEN WORKSPACE
========================================== */

function openWorkspace(taskId) {

  const workspace =
    document.getElementById(
      "workspace-" + taskId
    );


  if (workspace) {

    workspace.style.display =
      "block";


    workspace.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }

}


/* ==========================================
   CLOSE WORKSPACE
========================================== */

function closeWorkspace(taskId) {

  const workspace =
    document.getElementById(
      "workspace-" + taskId
    );


  if (workspace) {

    workspace.style.display =
      "none";

  }

}


/* ==========================================
   IMAGE PREVIEW
========================================== */

function previewProof(taskId) {

  const input =
    document.getElementById(
      "proof-" + taskId
    );


  const preview =
    document.getElementById(
      "preview-" + taskId
    );


  if (
    !input.files ||
    !input.files[0]
  ) {

    preview.style.display =
      "none";

    return;
  }


  const file =
    input.files[0];


  if (
    !file.type.startsWith("image/")
  ) {

    input.value = "";

    showMessage(
      "Please select an image.",
      "error"
    );

    return;
  }


  if (
    file.size >
    8 * 1024 * 1024
  ) {

    input.value = "";

    showMessage(
      "Image must be 8MB or smaller.",
      "error"
    );

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      preview.src =
        event.target.result;

      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);

}


/* ==========================================
   SUBMIT TASK
========================================== */

async function submitTask(taskId) {

  const usernameInput =
    document.getElementById(
      "username-" + taskId
    );


  const proofInput =
    document.getElementById(
      "proof-" + taskId
    );


  const submitButton =
    document.getElementById(
      "submit-" + taskId
    );


  const username =
    usernameInput.value.trim();


  if (!username) {

    showMessage(
      "Please enter your username.",
      "error"
    );

    usernameInput.focus();

    return;
  }


  if (
    !proofInput.files ||
    !proofInput.files[0]
  ) {

    showMessage(
      "Please upload your screenshot proof.",
      "error"
    );

    return;
  }


  const file =
    proofInput.files[0];


  if (
    !file.type.startsWith("image/")
  ) {

    showMessage(
      "Proof must be an image.",
      "error"
    );

    return;
  }


  if (
    file.size >
    8 * 1024 * 1024
  ) {

    showMessage(
      "Image must be 8MB or smaller.",
      "error"
    );

    return;
  }


  submitButton.disabled =
    true;


  submitButton.textContent =
    "Uploading proof...";


  let uploadedPath = null;


  try {

    /*
      Upload screenshot to private
      task-proofs bucket.
    */

    const extension =
      getFileExtension(
        file.name
      );


    const filePath =
      currentUser.id +
      "/" +
      taskId +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const {
      data: uploadData,
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("task-proofs")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );


    if (uploadError) {

      console.error(
        uploadError
      );

      throw new Error(
        "Unable to upload screenshot."
      );

    }


    uploadedPath =
      uploadData.path;


    /*
      Insert submission.

      The database trigger automatically:
      - sets reward
      - sets PENDING status
      - adds reward to pending balance
    */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("Submission")
        .insert({

          task_id: taskId,

          worker_id:
            currentUser.id,

          username:
            username,

          proof:
            uploadedPath

        });


    if (insertError) {

      console.error(
        insertError
      );


      /*
        Remove uploaded screenshot
        if database submission failed.
      */

      await supabaseClient
        .storage
        .from("task-proofs")
        .remove([
          uploadedPath
        ]);


      throw new Error(
        insertError.message ||
        "Unable to submit task."
      );

    }


    /*
      SUCCESS

      Because loadTasks() checks ALL
      submissions from this worker,
      this task will now permanently
      disappear from their list.
    */

    showMessage(
      "Task submitted successfully. Your reward has been added to Pending Balance.",
      "success"
    );


    await loadTasks();


  } catch (error) {

    console.error(error);


    showMessage(
      error.message ||
      "Something went wrong while submitting the task.",
      "error"
    );


    submitButton.disabled =
      false;


    submitButton.textContent =
      "Submit Task";

  }

}


/* ==========================================
   FILE EXTENSION
========================================== */

function getFileExtension(filename) {

  const parts =
    String(filename)
      .split(".");


  if (parts.length < 2) {
    return "jpg";
  }


  const extension =
    parts
      .pop()
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      );


  const allowed = [
    "jpg",
    "jpeg",
    "png",
    "webp"
  ];


  if (
    !allowed.includes(extension)
  ) {

    return "jpg";

  }


  return extension;

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "%3C"
    )
    .replace(
      />/g,
      "%3E"
    );

}


/* ==========================================
   START
========================================== */

initialize();

</script>

</body>
</html>

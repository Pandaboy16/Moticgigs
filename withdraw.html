<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">

  <title>Withdraw - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    .header {
      background: #0b8f55;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .balance {
      background: #e9f8f0;
      border: 1px solid #bde8d0;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    .balance-label {
      color: #555;
      font-size: 14px;
    }

    .balance-amount {
      color: #087d4a;
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 9px;
      background: #0b8f55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9bbcac;
      cursor: not-allowed;
    }

    .back-btn {
      background: #eee;
      color: #333;
      margin-top: 10px;
    }

    .notice {
      background: #fff8df;
      border: 1px solid #f0d77a;
      color: #6c5600;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #e6f7ed;
      color: #087d4a;
      border: 1px solid #b7e3c9;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a40000;
      border: 1px solid #efb7b7;
    }

    .loading {
      color: #666;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>Withdraw</h2>
  </div>

  <div class="container">

    <div class="balance">
      <div class="balance-label">Available Worker Balance</div>
      <div class="balance-amount" id="balance">₦0.00</div>
    </div>

    <div class="card">

      <div class="notice">
        Minimum withdrawal amount is <strong>₦500</strong>.
        Only your available worker balance can be withdrawn.
      </div>

      <label for="amount">Withdrawal Amount</label>
      <input
        type="number"
        id="amount"
        min="500"
        step="1"
        placeholder="Enter amount"
      >

      <label for="bank">Bank / MFB</label>
      <select id="bank">
        <option value="">Loading banks...</option>
      </select>

      <label for="accountNumber">Account Number</label>
      <input
        type="text"
        id="accountNumber"
        inputmode="numeric"
        maxlength="10"
        placeholder="Enter 10-digit account number"
      >

      <label for="accountName">Account Name</label>
      <input
        type="text"
        id="accountName"
        placeholder="Enter account name"
      >

      <button id="withdrawBtn" onclick="submitWithdrawal()">
        Request Withdrawal
      </button>

      <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
      >
        Back to Dashboard
      </button>

      <div id="message" class="message"></div>

    </div>
  </div>

<script>
  const SUPABASE_URL =
    "https://jfoijwjqfaewzyzjawbw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let currentBalance = 0;

  async function init() {

    try {

      const {
        data: { user },
        error: authError
      } = await supabaseClient.auth.getUser();

      if (authError || !user) {
        window.location.href = "index.html";
        return;
      }

      currentUser = user;

      // Check profile
      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("Moticgigs")
        .select("role,status")
        .eq("Id", user.id)
        .single();

      if (profileError || !profile) {
        showMessage("Unable to load your profile.", "error");
        return;
      }

      if (profile.status === "banned") {
        showMessage(
          "Your account has been banned.",
          "error"
        );
        return;
      }

      if (profile.role !== "worker") {
        showMessage(
          "Withdrawals are available only to workers.",
          "error"
        );
        document.getElementById("withdrawBtn").disabled = true;
        return;
      }

      await loadWallet();
      await loadBanks();

    } catch (error) {

      console.error(error);

      showMessage(
        "Something went wrong while loading the page.",
        "error"
      );
    }
  }


  async function loadWallet() {

    const {
      data,
      error
    } = await supabaseClient
      .from("Wallet")
      .select("available_balance")
      .eq("user_id", currentUser.id)
      .eq("wallet_type", "WORKER")
      .single();

    if (error) {

      console.error("Wallet error:", error);

      showMessage(
        "Could not load your wallet balance.",
        "error"
      );

      return;
    }

    currentBalance =
      Number(data?.available_balance || 0);

    document.getElementById("balance").textContent =
      "₦" + currentBalance.toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
  }


  async function loadBanks() {

    const bankSelect =
      document.getElementById("bank");

    bankSelect.innerHTML =
      '<option value="">Loading banks...</option>';

    const {
      data: banks,
      error
    } = await supabaseClient
      .from("Banks")
      .select("id,name,type")
      .eq("active", true)
      .order("type", { ascending: true })
      .order("name", { ascending: true });

    if (error) {

      console.error("Banks error:", error);

      bankSelect.innerHTML =
        '<option value="">Unable to load banks</option>';

      showMessage(
        "Could not load the bank list.",
        "error"
      );

      return;
    }

    if (!banks || banks.length === 0) {

      bankSelect.innerHTML =
        '<option value="">No active banks available</option>';

      return;
    }

    bankSelect.innerHTML =
      '<option value="">Select bank / MFB</option>';

    // Group institutions by their database type.
    const groups = {};

    banks.forEach(bank => {

      const type =
        bank.type || "Other";

      if (!groups[type]) {
        groups[type] = [];
      }

      groups[type].push(bank);
    });

    Object.keys(groups)
      .sort()
      .forEach(type => {

        const group =
          document.createElement("optgroup");

        group.label = type;

        groups[type]
          .sort((a, b) =>
            a.name.localeCompare(b.name)
          )
          .forEach(bank => {

            const option =
              document.createElement("option");

            option.value = bank.id;

            option.textContent =
              bank.name;

            option.dataset.name =
              bank.name;

            option.dataset.type =
              bank.type || "";

            group.appendChild(option);
          });

        bankSelect.appendChild(group);
      });
  }


  async function submitWithdrawal() {

    const amountInput =
      document.getElementById("amount");

    const bankSelect =
      document.getElementById("bank");

    const accountNumber =
      document.getElementById("accountNumber")
        .value.trim();

    const accountName =
      document.getElementById("accountName")
        .value.trim();

    const amount =
      Number(amountInput.value);

    const bankId =
      bankSelect.value;

    const selectedOption =
      bankSelect.options[
        bankSelect.selectedIndex
      ];

    const bankName =
      selectedOption?.dataset?.name || "";

    if (!amount || amount < 500) {

      showMessage(
        "Minimum withdrawal amount is ₦500.",
        "error"
      );

      return;
    }

    if (amount > currentBalance) {

      showMessage(
        "Insufficient available balance.",
        "error"
      );

      return;
    }

    if (!bankId) {

      showMessage(
        "Please select your bank or MFB.",
        "error"
      );

      return;
    }

    if (!/^\d{10}$/.test(accountNumber)) {

      showMessage(
        "Please enter a valid 10-digit account number.",
        "error"
      );

      return;
    }

    if (!accountName) {

      showMessage(
        "Please enter the account name.",
        "error"
      );

      return;
    }

    const button =
      document.getElementById("withdrawBtn");

    button.disabled = true;
    button.textContent = "Submitting...";

    try {

      const {
        error
      } = await supabaseClient
        .from("Withdrawal")
        .insert({
          worker_id: currentUser.id,
          bank_id: bankId,
          bank_name: bankName,
          account_number: accountNumber,
          account_name: accountName,
          amount: amount,
          status: "PENDING"
        });

      if (error) {
        throw error;
      }

      showMessage(
        "Withdrawal request submitted successfully. It is now pending admin approval.",
        "success"
      );

      amountInput.value = "";
      bankSelect.value = "";
      document.getElementById("accountNumber").value = "";
      document.getElementById("accountName").value = "";

      // Refresh the balance because the database trigger
      // deducts the amount immediately.
      await loadWallet();

    } catch (error) {

      console.error("Withdrawal error:", error);

      showMessage(
        error.message ||
        "Could not submit withdrawal request.",
        "error"
      );

    } finally {

      button.disabled = false;
      button.textContent = "Request Withdrawal";
    }
  }


  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  init();
</script>
<script src="/pwa.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#16a34a">

  <title>Login - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #16a34a;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }

    .password-row label {
      margin-bottom: 0;
    }

    .forgot-link {
      color: #16a34a;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      color: #666;
    }

    .signup a {
      color: #16a34a;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">MoticGigs</div>

  <div class="subtitle">
    Login to your account
  </div>

  <form id="loginForm">

    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
      autocomplete="email"
    >

    <div class="password-row">
      <label for="password">Password</label>

      <a
        href="forgot-password.html"
        class="forgot-link"
      >
        Forgot Password?
      </a>
    </div>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
      autocomplete="current-password"
    >

    <button type="submit" id="loginButton">
      Log In
    </button>

  </form>

  <div id="message"></div>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  message.textContent = "";

  loginButton.disabled = true;
  loginButton.textContent = "Logging in...";


  // Login
  const {
    data: loginData,
    error: loginError
  } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });


  if (loginError) {

    console.error(loginError);

    message.textContent =
      "Login failed: " + loginError.message;

    message.style.color = "red";

    loginButton.disabled = false;
    loginButton.textContent = "Log In";

    return;
  }


  const user = loginData.user;


  if (!user) {

    message.textContent =
      "Login failed. User account was not found.";

    message.style.color = "red";

    loginButton.disabled = false;
    loginButton.textContent = "Log In";

    return;
  }


  // Get user's role
  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("Moticgigs")
    .select("role, status")
    .eq("Id", user.id)
    .single();


  if (profileError || !profile) {

    console.error(profileError);

    message.textContent =
      "Login succeeded, but your MoticGigs profile could not be loaded.";

    message.style.color = "red";

    await supabaseClient.auth.signOut();

    loginButton.disabled = false;
    loginButton.textContent = "Log In";

    return;
  }


  // Check whether account is banned
  if (profile.status === "banned") {

    message.textContent =
      "Your MoticGigs account has been banned.";

    message.style.color = "red";

    await supabaseClient.auth.signOut();

    loginButton.disabled = false;
    loginButton.textContent = "Log In";

    return;
  }


  message.textContent =
    "Login successful. Opening your dashboard...";

  message.style.color = "green";


  // Admin goes to Admin Dashboard
  if (profile.role === "admin") {

    window.location.href = "admin.html";

  } else {

    // Normal users go to Dashboard
    window.location.href = "dashboard.html";

  }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#16a34a">

  <title>Reset Password - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #16a34a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 22px;
    }

    .login a {
      color: #16a34a;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">MoticGigs</div>

  <div class="subtitle">
    Create a new password for your MoticGigs account.
  </div>

  <form id="resetForm">

    <label for="password">New Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter new password"
      minlength="6"
      required
      autocomplete="new-password"
    >

    <label for="confirmPassword">Confirm Password</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      minlength="6"
      required
      autocomplete="new-password"
    >

    <button type="submit" id="resetButton">
      Update Password
    </button>

  </form>

  <div id="message"></div>

  <div class="login">
    <a href="login.html">← Back to Login</a>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const resetForm =
  document.getElementById("resetForm");

const resetButton =
  document.getElementById("resetButton");

const message =
  document.getElementById("message");


resetForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  message.textContent = "";


  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    message.style.color = "red";

    return;
  }


  if (password !== confirmPassword) {

    message.textContent =
      "Passwords do not match.";

    message.style.color = "red";

    return;
  }


  resetButton.disabled = true;
  resetButton.textContent = "Updating...";


  const {
    error
  } = await supabaseClient.auth.updateUser({
    password: password
  });


  if (error) {

    console.error(error);

    message.textContent =
      "Could not update password: " + error.message;

    message.style.color = "red";

    resetButton.disabled = false;
    resetButton.textContent = "Update Password";

    return;
  }


  message.textContent =
    "Password updated successfully. Redirecting to login...";

  message.style.color = "green";


  setTimeout(() => {

    window.location.href = "login.html";

  }, 2000);

});

</script>

</body>
</html>

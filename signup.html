<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/manifest.json">

  <title>Create Account - MoticGigs</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      color: #075e3d;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .role-title {
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .role-option {
      display: block;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .role-option:hover {
      border-color: #075e3d;
    }

    .role-option input {
      width: auto;
      margin-right: 10px;
    }

    .role-name {
      font-weight: bold;
      font-size: 17px;
    }

    .role-description {
      display: block;
      margin-left: 27px;
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #075e3d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .error {
      background: #ffe0e0;
      color: #a00000;
    }

    .success {
      background: #dff5e8;
      color: #126b3e;
    }

    .otp-box {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #f0f8f4;
      border-radius: 10px;
    }

    .otp-box h3 {
      margin-top: 0;
      color: #075e3d;
    }

    .otp-box p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .otp-input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 24px;
      font-weight: bold;
    }

    .resend {
      background: transparent;
      color: #075e3d;
      border: 1px solid #075e3d;
      margin-top: 10px;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #075e3d;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">

    <h1>MoticGigs</h1>

    <p class="subtitle">
      Create your account
    </p>

    <form id="signupForm">

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <div class="role-title">
        What do you want to do on MoticGigs?
      </div>

      <label class="role-option">

        <input
          type="radio"
          name="role"
          value="worker"
          checked
        >

        <span class="role-name">
          👷 Earn Money (Worker)
        </span>

        <span class="role-description">
          Complete tasks posted by advertisers and earn money.
        </span>

      </label>

      <label class="role-option">

        <input
          type="radio"
          name="role"
          value="advertiser"
        >

        <span class="role-name">
          📢 Advertise / Post Tasks
        </span>

        <span class="role-description">
          Deposit money and create tasks for workers.
        </span>

      </label>

      <button
        type="submit"
        id="signupButton">
        Send Verification Code
      </button>

    </form>

    <!-- OTP SECTION -->

    <div id="otpBox" class="otp-box">

      <h3>Verify your email</h3>

      <p>
        We sent a 6-digit verification code to
        <strong id="otpEmail"></strong>.
      </p>

      <label for="otpCode">
        Verification Code
      </label>

      <input
        type="text"
        id="otpCode"
        class="otp-input"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="000000"
      >

      <button
        type="button"
        id="verifyButton">
        Verify & Create Account
      </button>

      <button
        type="button"
        id="resendButton"
        class="resend">
        Resend Code
      </button>

    </div>

    <div
      id="message"
      class="message">
    </div>

    <div class="login">
      Already have an account?
      <a href="login.html">
        Log In
      </a>
    </div>

  </div>

</div>

<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://jfoijwjqfaewzyzjawbw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // EMAILJS
  // ==========================================

  const EMAILJS_SERVICE_ID =
    "service_o8ykxm7";

  const EMAILJS_TEMPLATE_ID =
    "template_zf7aohn";

  const EMAILJS_PUBLIC_KEY =
    "d2iy1nsNp2ltA2eyH";


  emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
  });


  // ==========================================
  // OTP VARIABLES
  // ==========================================

  let generatedOTP = "";

  let otpExpiresAt = 0;

  let otpVerified = false;


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display =
      "block";
  }


  // ==========================================
  // GENERATE OTP
  // ==========================================

  function generateOTP() {

    return Math.floor(
      100000 + Math.random() * 900000
    ).toString();

  }


  // ==========================================
  // SEND OTP
  // ==========================================

  async function sendOTP() {

    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    if (!fullName) {

      showMessage(
        "Please enter your full name.",
        "error"
      );

      return false;
    }

    if (!email) {

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return false;
    }


    generatedOTP =
      generateOTP();

    otpExpiresAt =
      Date.now() + (10 * 60 * 1000);


    try {

      await emailjs.send(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        {
          name: fullName,
          email: email,
          passcode: generatedOTP
        }
      );


      document
        .getElementById("otpEmail")
        .textContent = email;


      document
        .getElementById("otpBox")
        .style.display = "block";


      showMessage(
        "Verification code sent to your email.",
        "success"
      );


      return true;

    } catch (error) {

      console.error(
        "EmailJS error:",
        error
      );

      showMessage(
        "We could not send the verification code. Please check your email address and try again.",
        "error"
      );

      return false;
    }
  }


  // ==========================================
  // CREATE ACCOUNT
  // ==========================================

  async function createAccount() {

    if (!generatedOTP) {

      showMessage(
        "Please request a verification code first.",
        "error"
      );

      return;
    }


    if (Date.now() > otpExpiresAt) {

      showMessage(
        "Your verification code has expired. Please request a new code.",
        "error"
      );

      generatedOTP = "";

      return;
    }


    const enteredOTP =
      document
        .getElementById("otpCode")
        .value
        .trim();


    if (enteredOTP !== generatedOTP) {

      showMessage(
        "Incorrect verification code.",
        "error"
      );

      return;
    }


    otpVerified = true;


    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const selectedRole =
      document
        .querySelector(
          'input[name="role"]:checked'
        )
        .value;


    const verifyButton =
      document.getElementById(
        "verifyButton"
      );


    verifyButton.disabled = true;

    verifyButton.textContent =
      "Creating account...";


    // ==========================================
    // SUPABASE SIGN UP
    // ==========================================

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            full_name: fullName,
            role: selectedRole
          }

        }

      });


    if (error) {

      console.error(error);

      verifyButton.disabled = false;

      verifyButton.textContent =
        "Verify & Create Account";

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    if (!data || !data.user) {

      verifyButton.disabled = false;

      verifyButton.textContent =
        "Verify & Create Account";

      showMessage(
        "Account could not be created.",
        "error"
      );

      return;
    }


    if (!data.session) {

      verifyButton.disabled = false;

      verifyButton.textContent =
        "Verify & Create Account";

      showMessage(
        "Account was created, but Supabase did not return a login session. Please check your Supabase email confirmation setting.",
        "error"
      );

      return;
    }


    generatedOTP = "";

    otpVerified = true;


    showMessage(
      "Email verified and account created successfully. Redirecting...",
      "success"
    );


    setTimeout(() => {

      window.location.href =
        "dashboard.html";

    }, 1000);

  }


  // ==========================================
  // INITIAL SIGNUP BUTTON
  // ==========================================

  document
    .getElementById("signupForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const button =
          document.getElementById(
            "signupButton"
          );


        button.disabled = true;

        button.textContent =
          "Sending code...";


        const sent =
          await sendOTP();


        if (sent) {

          button.textContent =
            "Code Sent";

        } else {

          button.disabled = false;

          button.textContent =
            "Send Verification Code";
        }

      }
    );


  // ==========================================
  // VERIFY BUTTON
  // ==========================================

  document
    .getElementById("verifyButton")
    .addEventListener(
      "click",
      createAccount
    );


  // ==========================================
  // RESEND OTP
  // ==========================================

  document
    .getElementById("resendButton")
    .addEventListener(
      "click",
      async function() {

        const button =
          document.getElementById(
            "resendButton"
          );

        button.disabled = true;

        button.textContent =
          "Sending...";


        const sent =
          await sendOTP();


        button.disabled = false;

        button.textContent =
          "Resend Code";

      }
    );


  // ==========================================
  // ONLY ALLOW NUMBERS IN OTP
  // ==========================================

  document
    .getElementById("otpCode")
    .addEventListener(
      "input",
      function() {

        this.value =
          this.value
            .replace(/\D/g, "")
            .slice(0, 6);

      }
    );

</script>

<script src="/pwa.js"></script>

</body>
</html>

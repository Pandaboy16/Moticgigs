<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - MotiGigs</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
      color: #222;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #16a34a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login-link a {
      color: #16a34a;
      text-decoration: none;
      font-weight: bold;
    }
  </style></head><body>  <div class="container">
    <div class="card">  <div class="logo">MotiGigs</div>
  <div class="subtitle">Complete tasks. Earn money.</div>

  <h2>Create Account</h2>

  <form id="signupForm">

    <label for="fullName">Full Name</label>
    <input
      type="text"
      id="fullName"
      placeholder="Enter your full name"
      required
    >

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="6"
      required
    >

    <label for="confirmPassword">Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      minlength="6"
      required
    >

    <button type="submit" id="signupButton">
      Create Account
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="login-link">
    Already have an account?
    <a href="login.html">Log In</a>
  </div>

</div>

  </div>  <script>
    // ==============================
    // SUPABASE CONNECTION
    // ==============================

    const SUPABASE_URL =
      "https://jfoijwjqfaewzyzjawbw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==============================
    // ELEMENTS
    // ==============================

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const message = document.getElementById("message");


    // ==============================
    // MESSAGE FUNCTION
    // ==============================

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }


    // ==============================
    // SIGN UP
    // ==============================

    signupForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      // Check name
      if (!fullName) {
        showMessage("Please enter your full name.", "error");
        return;
      }


      // Check passwords
      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }


      // Check password length
      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );
        return;
      }


      // Disable button
      signupButton.disabled = true;
      signupButton.textContent = "Creating Account...";

      message.className = "message";


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                full_name: fullName
              }
            }

          });


        // Supabase error
        if (error) {
          throw error;
        }


        // Make sure a user was created
        if (!data || !data.user) {
          throw new Error(
            "Account could not be created. Please try again."
          );
        }


        // Because Confirm Email is disabled,
        // Supabase should return an active session.
        if (!data.session) {
          throw new Error(
            "Account created, but no active session was returned. Please check that Confirm Email is OFF in Supabase."
          );
        }


        // Success
        showMessage(
          "Account created successfully! Redirecting...",
          "success"
        );


        // Give Supabase a moment to save the session
        setTimeout(function() {

          window.location.href = "dashboard.html";

        }, 1200);


      } catch (error) {

        console.error("Signup error:", error);

        showMessage(
          error.message || "Something went wrong. Please try again.",
          "error"
        );

        signupButton.disabled = false;
        signupButton.textContent = "Create Account";

      }

    });
  </script></body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f7f4;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 29px;
      font-weight: bold;
      color: #159447;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #159447;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: #159447;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #e8f5ec;
      color: #159447;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      display: block;
      background: #e7f7ec;
      color: #126b32;
    }

    .error {
      display: block;
      background: #ffeded;
      color: #b42318;
    }

    .hidden {
      display: none;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #159447;
      text-decoration: none;
      font-size: 14px;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">MoticGigs</div>

    <h2>Reset Your Password</h2>

    <p class="description">
      Enter your registered email address to receive a password
      reset code.
    </p>

    <form id="emailForm">
      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required
      >

      <button type="submit" id="sendButton">
        Send Reset Code
      </button>
    </form>

    <form id="resetForm" class="hidden">

      <label for="otp">Six-Digit Verification Code</label>

      <input
        type="text"
        id="otp"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="Enter the code from your email"
        autocomplete="one-time-code"
        required
      >

      <label for="newPassword">New Password</label>

      <input
        type="password"
        id="newPassword"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm New Password</label>

      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your new password again"
        required
      >

      <button type="submit" id="resetButton">
        Reset Password
      </button>

      <button
        type="button"
        class="secondary"
        id="resendButton"
      >
        Request Another Code
      </button>

    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <a href="login.html" class="back-link">
      Back to Login
    </a>

    <p class="note">
      Never share your verification code with anyone.
    </p>

  </main>

  <script>
    const SUPABASE_URL =
      "https://jfoijwjqfaewzyzjawbw.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const emailForm = document.getElementById("emailForm");
    const resetForm = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const sendButton = document.getElementById("sendButton");
    const resetButton = document.getElementById("resetButton");
    const resendButton = document.getElementById("resendButton");
    const messageBox = document.getElementById("message");

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    async function callFunction(functionName, payload) {
      const { data, error } = await supabaseClient.functions.invoke(
        functionName,
        { body: payload }
      );

      if (error) {
        if (data && data.error) {
          throw new Error(data.error);
        }

        throw new Error(
          "The request failed. Please try again. If the problem continues, check the Edge Function logs."
        );
      }

      if (!data || data.success !== true) {
        throw new Error(
          data && data.error
            ? data.error
            : "The request could not be completed."
        );
      }

      return data;
    }

    async function sendResetCode() {
      clearMessage();

      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        showMessage("Please enter your email address.", "error");
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";

      try {
        await callFunction("send-password-reset-otp", {
          email: email
        });

        emailForm.classList.add("hidden");
        resetForm.classList.remove("hidden");

        showMessage(
          "If your account exists, a reset code has been sent. Check your inbox and spam folder.",
          "success"
        );

      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send Reset Code";
      }
    }

    emailForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      await sendResetCode();
    });

    resendButton.addEventListener("click", async function() {
      await sendResetCode();
    });

    resetForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      clearMessage();

      const email = emailInput.value.trim().toLowerCase();
      const otp = otpInput.value.trim();
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!/^[0-9]{6}$/.test(otp)) {
        showMessage(
          "Please enter the six-digit verification code.",
          "error"
        );
        return;
      }

      if (newPassword.length < 8) {
        showMessage(
          "Your new password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage(
          "Your passwords do not match.",
          "error"
        );
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Verifying...";

      try {
        await callFunction("verify-password-reset-otp", {
          email: email,
          otp: otp,
          newPassword: newPassword
        });

        showMessage(
          "Your password has been reset successfully. You can now log in with your new password.",
          "success"
        );

        resetForm.classList.add("hidden");

        setTimeout(function() {
          window.location.href = "login.html";
        }, 2500);

      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        resetButton.disabled = false;
        resetButton.textContent = "Reset Password";
      }
    });
  </script>

</body>
</html>

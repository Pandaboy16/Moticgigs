<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MoticGigs Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #17211b;
    }

    .header {
      background: #0f9d58;
      color: white;
      padding: 18px 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logout {
      border: none;
      background: rgba(255,255,255,.18);
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .welcome {
      margin-top: 12px;
    }

    .welcome h2 {
      margin: 0;
      font-size: 21px;
    }

    .welcome p {
      margin: 5px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .balance-card {
      background: #0f9d58;
      color: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .balance-label {
      font-size: 14px;
      opacity: .9;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin-top: 7px;
    }

    .pending {
      margin-top: 10px;
      font-size: 14px;
      opacity: .95;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 22px 0 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .action {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 18px 10px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .action:hover {
      background: #f0fdf4;
    }

    .task {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .task-title {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .task-info {
      font-size: 13px;
      color: #666;
      margin: 4px 0;
    }

    .task-reward {
      color: #0f9d58;
      font-weight: bold;
      margin-top: 10px;
    }

    .loading {
      background: white;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      color: #777;
    }

    .empty {
      background: white;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      color: #777;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .advertiser-only,
    .worker-only {
      display: none;
    }

    @media (max-width: 500px) {
      .actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .balance {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="header-top">

      <div class="logo">
        MoticGigs
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

    <div class="welcome">

      <h2 id="welcomeName">
        Welcome
      </h2>

      <p id="accountType">
        Loading account...
      </p>

    </div>

  </div>


  <div class="container">

    <div id="errorBox" class="error"></div>


    <!-- BALANCE -->

    <div class="balance-card">

      <div class="balance-label">
        Available Balance
      </div>

      <div
        id="availableBalance"
        class="balance"
      >
        ₦0.00
      </div>

      <div
        id="pendingBalance"
        class="pending"
      >
        Pending: ₦0.00
      </div>

    </div>


    <!-- =========================
         WORKER ACTIONS
    ========================== -->

    <div
      id="workerSection"
      class="worker-only"
    >

      <div class="section-title">
        Worker
      </div>

      <div class="actions">

        <button
          class="action"
          onclick="goAvailableTasks()"
        >
          📋 Available Tasks
        </button>

        <button
          class="action"
          onclick="goWithdraw()"
        >
          💰 Withdraw
        </button>

        <button
          class="action"
          onclick="goTransactions()"
        >
          📊 Transactions
        </button>

        <button
          class="action"
          onclick="goProfile()"
        >
          👤 Profile
        </button>

      </div>

      <div class="section-title">
        Available Tasks
      </div>

      <div id="workerTasks">

        <div class="loading">
          Loading available tasks...
        </div>

      </div>

    </div>


    <!-- =========================
         ADVERTISER ACTIONS
    ========================== -->

    <div
      id="advertiserSection"
      class="advertiser-only"
    >

      <div class="section-title">
        Advertiser
      </div>

      <div class="actions">

        <button
          class="action"
          onclick="goPostTask()"
        >
          ➕ Post Task
        </button>

        <button
          class="action"
          onclick="goDeposit()"
        >
          💳 Deposit
        </button>

        <button
          class="action"
          onclick="goMyTasks()"
        >
          📋 My Tasks
        </button>

        <button
          class="action"
          onclick="goTransactions()"
        >
          📊 Transactions
        </button>

        <button
          class="action"
          onclick="goProfile()"
        >
          👤 Profile
        </button>

      </div>

      <div class="section-title">
        My Tasks
      </div>

      <div id="advertiserTasks">

        <div class="loading">
          Loading your tasks...
        </div>

      </div>

    </div>

  </div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ==========================================
   VARIABLES
========================================== */

let currentUser = null;
let currentRole = null;


/* ==========================================
   START
========================================== */

loadDashboard();


/* ==========================================
   LOAD DASHBOARD
========================================== */

async function loadDashboard() {

  try {

    hideError();


    /* GET USER */

    const {
      data: userData,
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {
      throw userError;
    }


    if (!userData.user) {

      window.location.href =
        "index.html";

      return;

    }


    currentUser =
      userData.user;


    /* GET PROFILE */

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("Moticgigs")
        .select(
          "full_name,email,role,status"
        )
        .eq(
          "Id",
          currentUser.id
        )
        .single();


    if (profileError) {
      throw profileError;
    }


    if (!profile) {

      throw new Error(
        "Profile not found."
      );

    }


    if (profile.status === "banned") {

      await supabaseClient.auth.signOut();

      alert(
        "This account has been banned."
      );

      window.location.href =
        "index.html";

      return;

    }


    currentRole =
      profile.role;


    /* WELCOME */

    document.getElementById(
      "welcomeName"
    ).textContent =
      "Welcome, " +
      (
        profile.full_name ||
        "User"
      );


    document.getElementById(
      "accountType"
    ).textContent =
      currentRole === "advertiser"
        ? "Advertiser account"
        : "Worker account";


    /* SHOW CORRECT DASHBOARD */

    if (currentRole === "advertiser") {

      document.getElementById(
        "advertiserSection"
      ).style.display =
        "block";

      await loadAdvertiserWallet();

      await loadAdvertiserTasks();

    }

    else {

      document.getElementById(
        "workerSection"
      ).style.display =
        "block";

      await loadWorkerWallet();

      await loadWorkerTasks();

    }

  }

  catch (error) {

    console.error(error);

    showError(
      error.message ||
      "Unable to load dashboard."
    );

  }

}


/* ==========================================
   WORKER WALLET
========================================== */

async function loadWorkerWallet() {

  const {
    data: wallet,
    error
  } =
    await supabaseClient
      .from("Wallet")
      .select(
        "available_balance,pending_balance"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "wallet_type",
        "WORKER"
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  document.getElementById(
    "availableBalance"
  ).textContent =
    formatMoney(
      wallet?.available_balance || 0
    );


  document.getElementById(
    "pendingBalance"
  ).textContent =
    "Pending: " +
    formatMoney(
      wallet?.pending_balance || 0
    );

}


/* ==========================================
   ADVERTISER WALLET
========================================== */

async function loadAdvertiserWallet() {

  const {
    data: wallet,
    error
  } =
    await supabaseClient
      .from("Wallet")
      .select(
        "available_balance,pending_balance"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "wallet_type",
        "ADVERTISER"
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  document.getElementById(
    "availableBalance"
  ).textContent =
    formatMoney(
      wallet?.available_balance || 0
    );


  document.getElementById(
    "pendingBalance"
  ).textContent =
    "Posting balance";

}


/* ==========================================
   WORKER TASKS
========================================== */

async function loadWorkerTasks() {

  const container =
    document.getElementById(
      "workerTasks"
    );


  const {
    data: tasks,
    error
  } =
    await supabaseClient
      .from("Task")
      .select(
        "id,platform,task_type,task_link,custom_comment,quantity,completed_quantity,worker_reward,status"
      )
      .eq(
        "status",
        "ACTIVE"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {
    throw error;
  }


  if (!tasks || tasks.length === 0) {

    container.innerHTML =
      `<div class="empty">
        No available tasks right now.
      </div>`;

    return;

  }


  /* GET USER SUBMISSIONS */

  const {
    data: submissions,
    error: submissionError
  } =
    await supabaseClient
      .from("Submission")
      .select("task_id,status")
      .eq(
        "worker_id",
        currentUser.id
      );


  if (submissionError) {
    throw submissionError;
  }


  const submittedTaskIds =
    new Set(
      (submissions || [])
        .map(
          item => item.task_id
        )
    );


  const availableTasks =
    tasks.filter(
      task =>
        !submittedTaskIds.has(
          task.id
        )
    );


  if (availableTasks.length === 0) {

    container.innerHTML =
      `<div class="empty">
        No new tasks available for you.
      </div>`;

    return;

  }


  container.innerHTML = "";


  availableTasks.forEach(
    task => {

      const remaining =
        Math.max(
          0,
          Number(task.quantity || 0) -
          Number(
            task.completed_quantity || 0
          )
        );


      const div =
        document.createElement(
          "div"
        );

      div.className =
        "task";


      div.innerHTML = `

        <div class="task-title">
          ${escapeHtml(
            task.platform
          )} -
          ${escapeHtml(
            task.task_type
          )}
        </div>

        <div class="task-info">
          Available slots:
          ${remaining}
        </div>

        <div class="task-reward">
          Earn:
          ${formatMoney(
            task.worker_reward
          )}
        </div>

        <button
          class="action"
          style="
            width:100%;
            margin-top:12px;
            background:#0f9d58;
            color:white;
          "
          onclick="openTask('${task.id}')"
        >
          Open Task
        </button>

      `;


      container.appendChild(
        div
      );

    }
  );

}


/* ==========================================
   ADVERTISER TASKS
========================================== */

async function loadAdvertiserTasks() {

  const container =
    document.getElementById(
      "advertiserTasks"
    );


  const {
    data: tasks,
    error
  } =
    await supabaseClient
      .from("Task")
      .select(
        "id,platform,task_type,quantity,completed_quantity,total_budget,status"
      )
      .eq(
        "advertiser_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(5);


  if (error) {
    throw error;
  }


  if (!tasks || tasks.length === 0) {

    container.innerHTML =
      `<div class="empty">
        You have not posted any tasks yet.
      </div>`;

    return;

  }


  container.innerHTML = "";


  tasks.forEach(
    task => {

      const completed =
        Number(
          task.completed_quantity || 0
        );

      const quantity =
        Number(
          task.quantity || 0
        );

      const percentage =
        quantity > 0
          ? Math.min(
              100,
              (completed / quantity) * 100
            )
          : 0;


      const div =
        document.createElement(
          "div"
        );

      div.className =
        "task";


      div.innerHTML = `

        <div class="task-title">
          ${escapeHtml(
            task.platform
          )} -
          ${escapeHtml(
            task.task_type
          )}
        </div>

        <div class="task-info">
          Progress:
          ${completed}/${quantity}
        </div>

        <div
          style="
            background:#e5e7eb;
            height:8px;
            border-radius:10px;
            margin-top:10px;
          "
        >

          <div
            style="
              width:${percentage}%;
              height:8px;
              background:#0f9d58;
              border-radius:10px;
            "
          ></div>

        </div>

        <div class="task-info">
          Status:
          ${escapeHtml(
            task.status
          )}
        </div>

        <div class="task-reward">
          Budget:
          ${formatMoney(
            task.total_budget
          )}
        </div>

      `;


      container.appendChild(
        div
      );

    }
  );

}


/* ==========================================
   NAVIGATION
========================================== */

/*
   THIS IS THE IMPORTANT FIX.

   Transactions now opens the connected
   transactions.html page instead of showing:

   "Transaction history will be added next."
*/

function goTransactions() {

  window.location.href =
    "transactions.html";

}


function goProfile() {

  window.location.href =
    "profile.html";

}


function goMyTasks() {

  window.location.href =
    "mytasks.html";

}


function goWithdraw() {

  window.location.href =
    "withdraw.html";

}


function goPostTask() {

  window.location.href =
    "posttask.html";

}


function goDeposit() {

  window.location.href =
    "deposit.html";

}


function goAvailableTasks() {

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* ==========================================
   OPEN TASK
========================================== */

function openTask(taskId) {

  /*
    The worker task workspace can be connected
    to the task ID later.
  */

  window.location.href =
    "task.html?id=" +
    encodeURIComponent(taskId);

}


/* ==========================================
   LOGOUT
========================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";

}


/* ==========================================
   FORMAT MONEY
========================================== */

function formatMoney(amount) {

  return "₦" +
    Number(amount || 0)
      .toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "block";

  box.textContent =
    message;

}


function hideError() {

  document.getElementById(
    "errorBox"
  ).style.display =
    "none";

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoticGigs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #17201b;
    }

    header {
      background: #0b8f55;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.9;
    }

    main {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 12px;
    }

    .card p {
      color: #66736c;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #0b8f55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .button.secondary {
      background: #e7f5ee;
      color: #0b8f55;
    }
  </style>
</head>

<body>

  <header>
    <h1>MoticGigs</h1>
    <p>Complete tasks. Earn money.</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome to MoticGigs</h2>

      <p>
        Earn money by completing simple social media
        and online tasks.
      </p>

      <a href="#" class="button">Create Account</a>
      <a href="#" class="button secondary">Log In</a>
    </div>
  </main>

</body>
</html>

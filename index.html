<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#0b8f55">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MoticGigs">

  <title>MoticGigs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #17201b;
    }

    header {
      background: #0b8f55;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.9;
    }

    main {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 12px;
    }

    .card p {
      color: #66736c;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #0b8f55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .button.secondary {
      background: #e7f5ee;
      color: #0b8f55;
    }

    #installBtn {
      display: block;
    }

    .install-note {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #f0f7f3;
      border-radius: 10px;
      font-size: 13px;
      color: #4d5b53;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header>
    <h1>MoticGigs</h1>
    <p>Complete tasks. Earn money.</p>
  </header>

  <main>
    <div class="card">

      <h2>Welcome to MoticGigs</h2>

      <p>
        Earn money by completing simple social media
        and online tasks.
      </p>

      <a href="signup.html" class="button">
        Create Account
      </a>

      <a href="login.html" class="button secondary">
        Log In
      </a>

      <button id="installBtn" class="button">
        📲 Install MoticGigs
      </button>

      <div id="installNote" class="install-note"></div>

    </div>
  </main>

  <script>
    let deferredPrompt = null;

    const installBtn = document.getElementById("installBtn");
    const installNote = document.getElementById("installNote");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();

      deferredPrompt = event;

      installBtn.style.display = "block";
      installNote.style.display = "none";
    });

    installBtn.addEventListener("click", async () => {

      if (deferredPrompt) {

        deferredPrompt.prompt();

        const result = await deferredPrompt.userChoice;

        console.log(
          "MoticGigs install choice:",
          result.outcome
        );

        deferredPrompt = null;

        return;
      }

      installNote.innerHTML =
        "Chrome has not provided the automatic install prompt yet.<br><br>" +
        "Tap the <strong>⋮</strong> menu in Chrome and choose " +
        "<strong>Add to Home screen</strong> if it is available.";

      installNote.style.display = "block";
    });

    window.addEventListener("appinstalled", () => {
      console.log("MoticGigs was installed.");

      installBtn.style.display = "none";
      installNote.style.display = "none";
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {

        navigator.serviceWorker.register("/service-worker.js")
          .then((registration) => {
            console.log(
              "MoticGigs service worker registered:",
              registration.scope
            );
          })
          .catch((error) => {
            console.error(
              "Service worker registration failed:",
              error
            );
          });

      });
    }
  </script>

  <script
    src="https://cdn.mellow.tel/widget.js?type=button&position=bottom-right&invite_id=rj85eph12t8"
    async>
  </script>

  <script src="/pwa.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Tasks - MoticGigs</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #17211b;
}

.header {
  background: #0f9d58;
  color: white;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.back {
  font-size: 24px;
  cursor: pointer;
}

.header h1 {
  margin: 0;
  font-size: 20px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.task {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.task-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.platform {
  font-weight: bold;
  font-size: 18px;
}

.status {
  padding: 5px 9px;
  border-radius: 20px;
  background: #dcfce7;
  color: #15803d;
  font-size: 12px;
  font-weight: bold;
}

.task-type {
  color: #555;
  margin-top: 7px;
}

.progress-container {
  margin-top: 18px;
}

.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 7px;
}

.progress {
  height: 9px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 40%;
  background: #0f9d58;
}

.details {
  margin-top: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.detail {
  background: #f8faf9;
  padding: 10px;
  border-radius: 8px;
}

.detail small {
  display: block;
  color: #777;
  margin-bottom: 4px;
}

.detail strong {
  font-size: 15px;
}

.view-button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #0f9d58;
  color: white;
  font-weight: bold;
  font-size: 15px;
}

.empty {
  background: white;
  padding: 35px;
  border-radius: 12px;
  text-align: center;
  color: #777;
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="history.back()">←</div>
  <h1>My Tasks</h1>
</div>

<div class="container">

  <div class="task">

    <div class="task-top">

      <div>
        <div class="platform">
          TikTok
        </div>

        <div class="task-type">
          Follow
        </div>
      </div>

      <div class="status">
        ACTIVE
      </div>

    </div>


    <div class="progress-container">

      <div class="progress-text">
        <span>Completed</span>
        <span>4 / 10</span>
      </div>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>

    </div>


    <div class="details">

      <div class="detail">
        <small>Price per Action</small>
        <strong>₦10</strong>
      </div>

      <div class="detail">
        <small>Total Budget</small>
        <strong>₦100</strong>
      </div>

      <div class="detail">
        <small>Worker Reward</small>
        <strong>₦5</strong>
      </div>

      <div class="detail">
        <small>Platform Revenue</small>
        <strong>₦5</strong>
      </div>

    </div>


    <button
      class="view-button"
      onclick="alert('Task details will be connected next.')"
    >
      View Task
    </button>

  </div>


  <div class="task">

    <div class="task-top">

      <div>
        <div class="platform">
          Facebook
        </div>

        <div class="task-type">
          Like
        </div>
      </div>

      <div class="status">
        ACTIVE
      </div>

    </div>


    <div class="progress-container">

      <div class="progress-text">
        <span>Completed</span>
        <span>25 / 50</span>
      </div>

      <div class="progress">
        <div
          class="progress-bar"
          style="width:50%"
        ></div>
      </div>

    </div>


    <div class="details">

      <div class="detail">
        <small>Price per Action</small>
        <strong>₦7</strong>
      </div>

      <div class="detail">
        <small>Total Budget</small>
        <strong>₦350</strong>
      </div>

      <div class="detail">
        <small>Worker Reward</small>
        <strong>₦3.50</strong>
      </div>

      <div class="detail">
        <small>Platform Revenue</small>
        <strong>₦3.50</strong>
      </div>

    </div>


    <button
      class="view-button"
      onclick="alert('Task details will be connected next.')"
    >
      View Task
    </button>

  </div>


</div>

</body>
        </html>

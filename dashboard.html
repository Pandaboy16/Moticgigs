<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoticGigs Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #16a34a;
      color: white;
      padding: 18px;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logout {
      background: white;
      color: #16a34a;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .balance-card {
      background: #16a34a;
      color: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .balance-title {
      font-size: 15px;
      opacity: .9;
    }

    .balance {
      font-size: 34px;
      font-weight: bold;
      margin: 8px 0 18px;
    }

    .pending {
      font-size: 15px;
      opacity: .95;
    }

    .deposit-btn {
      margin-top: 18px;
      background: white;
      color: #16a34a;
      border: none;
      padding: 12px 20px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .action {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 18px 10px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      cursor: pointer;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .section h2 {
      margin-top: 0;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 25px 10px;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      color: #dc2626;
    }

    @media (max-width: 600px) {
      .actions {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">MoticGigs</div>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
</header>

<div class="container">

  <div class="welcome">
    <h2 id="welcomeText">Welcome</h2>
    <p>Your MoticGigs dashboard</p>
  </div>

  <div class="balance-card">

    <div class="balance-title">
      Available Balance
    </div>

    <div class="balance">
      ₦<span id="availableBalance">0.00</span>
    </div>

    <div class="pending">
      Pending Balance:
      ₦<span id="pendingBalance">0.00</span>
    </div>

    <button
      class="deposit-btn"
      onclick="window.location.href='deposit.html'">
      + Deposit
    </button>

  </div>


  <div class="actions">

    <button
      class="action"
      onclick="showComingSoon('Available Tasks')">
      📋 Available Tasks
    </button>

    <button
      class="action"
      onclick="showComingSoon('Withdraw')">
      💰 Withdraw
    </button>

    <button
      class="action"
      onclick="showComingSoon('Profile')">
      👤 Profile
    </button>

    <button
      class="action"
      onclick="showComingSoon('Transaction History')">
      📊 Transactions
    </button>

  </div>


  <div class="section">

    <h2>Available Tasks</h2>

    <div class="empty">
      No tasks available yet.
      <br><br>
      Tasks posted by advertisers will appear here.
    </div>

  </div>


  <div id="message"></div>

</div>


<script>

const SUPABASE_URL =
  "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadDashboard() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    window.location.href = "login.html";

    return;
  }


  // Load profile
  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("Moticgigs")
    .select("full_name, email")
    .eq("Id", user.id)
    .single();


  if (!profileError && profile) {

    const name =
      profile.full_name || user.email;

    document.getElementById("welcomeText").textContent =
      "Welcome, " + name;

  }


  // Load wallet
  const {
    data: wallet,
    error: walletError
  } = await supabaseClient
    .from("Wallet")
    .select("available_balance, pending_balance")
    .eq("user_id", user.id)
    .single();


  if (!walletError && wallet) {

    document.getElementById("availableBalance")
      .textContent =
      Number(wallet.available_balance || 0)
      .toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });


    document.getElementById("pendingBalance")
      .textContent =
      Number(wallet.pending_balance || 0)
      .toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

  }

}


function showComingSoon(feature) {

  document.getElementById("message").textContent =
    feature + " will be added next.";

}


document
  .getElementById("logoutBtn")
  .addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

  });


loadDashboard();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - MoticGigs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #17211b;
}

.header {
  background: #0f9d58;
  color: white;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.back {
  font-size: 24px;
  cursor: pointer;
}

.header h1 {
  margin: 0;
  font-size: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.profile-card {
  background: white;
  border-radius: 15px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.avatar {
  width: 85px;
  height: 85px;
  background: #0f9d58;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
  font-size: 35px;
  font-weight: bold;
}

.name {
  font-size: 22px;
  font-weight: bold;
  margin-top: 15px;
}

.email {
  color: #777;
  margin-top: 6px;
  word-break: break-word;
}

.info {
  margin-top: 25px;
  text-align: left;
}

.info-item {
  padding: 15px 0;
  border-bottom: 1px solid #eee;
}

.info-item:last-child {
  border-bottom: none;
}

.label {
  font-size: 13px;
  color: #777;
  margin-bottom: 5px;
}

.value {
  font-weight: bold;
}

.loading {
  color: #777;
  text-align: center;
  padding: 20px;
}

.error {
  color: #d93025;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="history.back()">←</div>
  <h1>My Profile</h1>
</div>

<div class="container">

  <div class="profile-card">

    <div class="avatar" id="avatar">
      M
    </div>

    <div class="name" id="profileName">
      Loading...
    </div>

    <div class="email" id="profileEmail">
      Loading...
    </div>

    <div class="info">

      <div class="info-item">
        <div class="label">Full Name</div>
        <div class="value" id="fullName">
          Loading...
        </div>
      </div>

      <div class="info-item">
        <div class="label">Email</div>
        <div class="value" id="email">
          Loading...
        </div>
      </div>

      <div class="info-item">
        <div class="label">Account Type</div>
        <div class="value" id="accountType">
          Loading...
        </div>
      </div>

      <div class="info-item">
        <div class="label">Account Status</div>
        <div class="value" id="accountStatus">
          Loading...
        </div>
      </div>

      <div class="info-item">
        <div class="label">Member Since</div>
        <div class="value" id="memberSince">
          Loading...
        </div>
      </div>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL = "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function loadProfile() {

  try {

    // Get logged-in user
    const {
      data: { user },
      error: authError
    } = await supabaseClient.auth.getUser();

    if (authError || !user) {

      window.location.href = "index.html";
      return;

    }

    // Get profile from Moticgigs table
    const {
      data: profile,
      error: profileError
    } = await supabaseClient
      .from("Moticgigs")
      .select("full_name, email, role, status, created_at")
      .eq("Id", user.id)
      .single();

    if (profileError) {

      console.error(profileError);

      document.getElementById("profileName").textContent =
        "Unable to load profile";

      document.getElementById("profileEmail").textContent =
        "";

      return;
    }

    // Full name
    const fullName =
      profile.full_name ||
      "MoticGigs User";

    document.getElementById("profileName").textContent =
      fullName;

    document.getElementById("fullName").textContent =
      fullName;


    // Email
    const email =
      profile.email ||
      user.email ||
      "No email";

    document.getElementById("profileEmail").textContent =
      email;

    document.getElementById("email").textContent =
      email;


    // Avatar first letter
    document.getElementById("avatar").textContent =
      fullName.charAt(0).toUpperCase();


    // Account type
    let accountType = "Worker";

    if (profile.role === "advertiser") {
      accountType = "Advertiser";
    }

    if (profile.role === "admin") {
      accountType = "Admin";
    }

    document.getElementById("accountType").textContent =
      accountType;


    // Account status
    const status =
      profile.status || "active";

    document.getElementById("accountStatus").textContent =
      status.charAt(0).toUpperCase() +
      status.slice(1);


    // Member since
    if (profile.created_at) {

      const date =
        new Date(profile.created_at);

      document.getElementById("memberSince").textContent =
        date.toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });

    } else {

      document.getElementById("memberSince").textContent =
        "Unknown";

    }

  } catch (error) {

    console.error(error);

    document.getElementById("profileName").textContent =
      "Unable to load profile";

  }

}


// Load profile
loadProfile();

</script>

</body>
</html>

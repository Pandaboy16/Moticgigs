<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      white-space: pre-wrap;
    }

    .section {
      background: white;
      margin-bottom: 25px;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .section h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .count {
      background: #111827;
      color: white;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .row {
      margin: 7px 0;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button.action {
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .approve:hover {
      background: #15803d;
    }

    .reject:hover {
      background: #b91c1c;
    }

    .loading {
      color: #6b7280;
      padding: 10px 0;
    }

    .empty {
      color: #6b7280;
      padding: 10px 0;
    }

    .proof-box {
      margin-top: 15px;
      padding: 12px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .proof-box img {
      width: 100%;
      max-width: 450px;
      max-height: 600px;
      object-fit: contain;
      display: block;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #f9fafb;
    }

    .proof-link {
      display: inline-block;
      margin-top: 8px;
      color: #2563eb;
      text-decoration: none;
    }

    .small {
      color: #6b7280;
      font-size: 13px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      resize: vertical;
      margin-top: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 9999;
      padding: 20px;
      overflow: auto;
    }

    .modal-content {
      background: white;
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
    }

    .modal-content img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      background: #111;
      border-radius: 8px;
    }

    .close {
      float: right;
      background: #111827;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Admin Dashboard - MoticGigs</h1>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="globalError" class="error"></div>

  <div class="status">
    <strong>Admin status:</strong>
    <span id="adminStatus">Checking...</span>
  </div>


  <!-- ========================= -->
  <!-- DEPOSITS -->
  <!-- ========================= -->

  <div class="section">

    <h2>
      Pending Deposits
      <span id="depositCount" class="count">0</span>
    </h2>

    <div id="deposits">
      <div class="loading">Loading deposits...</div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- WITHDRAWALS -->
  <!-- ========================= -->

  <div class="section">

    <h2>
      Pending Withdrawals
      <span id="withdrawalCount" class="count">0</span>
    </h2>

    <div id="withdrawals">
      <div class="loading">Loading withdrawals...</div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- SUBMISSIONS -->
  <!-- ========================= -->

  <div class="section">

    <h2>
      Pending Worker Submissions
      <span id="submissionCount" class="count">0</span>
    </h2>

    <div id="submissions">
      <div class="loading">Loading submissions...</div>
    </div>

  </div>

</div>


<!-- ========================= -->
<!-- IMAGE MODAL -->
<!-- ========================= -->

<div id="imageModal" class="modal">

  <div class="modal-content">

    <button class="close" onclick="closeImage()">Close</button>

    <h3>Worker Screenshot</h3>

    <img id="modalImage" src="" alt="Worker proof">

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://jfoijwjqfaewzyzjawbw.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // GLOBAL ERROR
  // ==========================================

  function showError(message) {

    const box = document.getElementById("globalError");

    box.style.display = "block";

    box.textContent = message;
  }


  function clearError() {

    const box = document.getElementById("globalError");

    box.style.display = "none";

    box.textContent = "";
  }


  // ==========================================
  // CHECK ADMIN
  // ==========================================

  async function checkAdmin() {

    try {

      clearError();

      const {
        data: userData,
        error: userError
      } = await supabaseClient.auth.getUser();


      if (userError) {
        throw userError;
      }


      if (!userData.user) {

        document.getElementById("adminStatus").textContent =
          "Not logged in";

        window.location.href = "index.html";

        return;
      }


      const user = userData.user;


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("Moticgigs")
          .select("role,status")
          .eq("Id", user.id)
          .single();


      if (profileError) {
        throw profileError;
      }


      if (
        !profile ||
        profile.role !== "admin" ||
        profile.status === "banned"
      ) {

        document.getElementById("adminStatus").textContent =
          "Access denied";

        showError(
          "Your account is not an active administrator."
        );

        return;
      }


      document.getElementById("adminStatus").textContent =
        "Active administrator";


      // Load everything separately.
      await loadDeposits();
      await loadWithdrawals();
      await loadSubmissions();

    }

    catch (error) {

      console.error(error);

      document.getElementById("adminStatus").textContent =
        "Error";

      showError(
        "Admin check failed:\n\n" +
        (error.message || JSON.stringify(error))
      );

    }

  }


  // ==========================================
  // DEPOSITS
  // ==========================================

  async function loadDeposits() {

    const container =
      document.getElementById("deposits");

    container.innerHTML =
      '<div class="loading">Loading deposits...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Deposit")
        .select("*")
        .eq("status", "PENDING")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML =
        '<div class="error" style="display:block">' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }


    document.getElementById("depositCount").textContent =
      data.length;


    if (!data.length) {

      container.innerHTML =
        '<div class="empty">No pending deposits.</div>';

      return;
    }


    container.innerHTML = "";


    data.forEach(deposit => {

      const card =
        document.createElement("div");

      card.className = "card";


      card.innerHTML = `

        <div class="row">
          <span class="label">Amount:</span>
          ₦${Number(deposit.amount || 0).toLocaleString()}
        </div>

        <div class="row">
          <span class="label">Sender:</span>
          ${escapeHtml(deposit.sender_name || "")}
        </div>

        <div class="row">
          <span class="label">Reference:</span>
          ${escapeHtml(deposit.payment_reference || "")}
        </div>

        <div class="row">
          <span class="label">Payment Method:</span>
          ${escapeHtml(deposit.payment_method || "")}
        </div>

        <div class="row small">
          Created:
          ${deposit.created_at
            ? new Date(deposit.created_at).toLocaleString()
            : ""}
        </div>

        <textarea
          id="depositNote_${deposit.id}"
          placeholder="Admin note (optional)"
        ></textarea>

        <div class="buttons">

          <button
            class="action approve"
            onclick="approveDeposit('${deposit.id}')"
          >
            Approve
          </button>

          <button
            class="action reject"
            onclick="rejectDeposit('${deposit.id}')"
          >
            Reject
          </button>

        </div>

      `;


      container.appendChild(card);

    });

  }


  // ==========================================
  // APPROVE DEPOSIT
  // ==========================================

  async function approveDeposit(id) {

    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "approve_deposit",
          {
            deposit_id: id
          }
        );


      if (error) {
        throw error;
      }


      alert("Deposit approved successfully.");

      await loadDeposits();

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not approve deposit:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // REJECT DEPOSIT
  // ==========================================

  async function rejectDeposit(id) {

    const note =
      document.getElementById(
        "depositNote_" + id
      )?.value || "";


    if (
      !confirm(
        "Reject this deposit?"
      )
    ) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "reject_deposit",
          {
            p_deposit_id: id,
            p_admin_note: note
          }
        );


      if (error) {
        throw error;
      }


      alert("Deposit rejected.");

      await loadDeposits();

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not reject deposit:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // WITHDRAWALS
  // ==========================================

  async function loadWithdrawals() {

    const container =
      document.getElementById("withdrawals");

    container.innerHTML =
      '<div class="loading">Loading withdrawals...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Withdrawal")
        .select("*")
        .eq("status", "PENDING")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML =
        '<div class="error" style="display:block">' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }


    document.getElementById("withdrawalCount").textContent =
      data.length;


    if (!data.length) {

      container.innerHTML =
        '<div class="empty">No pending withdrawals.</div>';

      return;
    }


    container.innerHTML = "";


    data.forEach(withdrawal => {

      const card =
        document.createElement("div");

      card.className = "card";


      const createdAt =
        withdrawal.created_at || "";


      card.innerHTML = `

        <div class="row">
          <span class="label">Amount:</span>
          ₦${Number(withdrawal.amount || 0).toLocaleString()}
        </div>

        <div class="row">
          <span class="label">Worker ID:</span>
          ${escapeHtml(withdrawal.worker_id || "")}
        </div>

        <div class="row">
          <span class="label">Bank:</span>
          ${escapeHtml(withdrawal.bank_name || "")}
        </div>

        <div class="row">
          <span class="label">Account Number:</span>
          ${escapeHtml(withdrawal.account_number || "")}
        </div>

        <div class="row">
          <span class="label">Account Name:</span>
          ${escapeHtml(withdrawal.account_name || "")}
        </div>

        <div class="row small">
          Created:
          ${createdAt
            ? new Date(createdAt).toLocaleString()
            : ""}
        </div>

        <textarea
          id="withdrawalNote_${createdAt}"
          placeholder="Admin note (optional)"
        ></textarea>

        <div class="buttons">

          <button
            class="action approve"
            onclick="approveWithdrawal(
              '${escapeJs(withdrawal.worker_id)}',
              '${escapeJs(createdAt)}',
              '${Number(withdrawal.amount || 0)}',
              '${escapeJs(withdrawal.account_number || "")}'
            )"
          >
            Approve
          </button>

          <button
            class="action reject"
            onclick="rejectWithdrawal(
              '${escapeJs(withdrawal.worker_id)}',
              '${escapeJs(createdAt)}',
              '${Number(withdrawal.amount || 0)}',
              '${escapeJs(withdrawal.account_number || "")}'
            )"
          >
            Reject
          </button>

        </div>

      `;


      container.appendChild(card);

    });

  }


  // ==========================================
  // APPROVE WITHDRAWAL
  // ==========================================

  async function approveWithdrawal(
    workerId,
    createdAt,
    amount,
    accountNumber
  ) {

    if (
      !confirm(
        "Approve this withdrawal?"
      )
    ) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "approve_withdrawal",
          {
            p_worker_id: workerId,
            p_created_at: createdAt,
            p_amount: Number(amount),
            p_account_number: accountNumber,
            p_provider_reference: null,
            p_admin_note: null
          }
        );


      if (error) {
        throw error;
      }


      alert(
        "Withdrawal approved successfully."
      );


      await loadWithdrawals();

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not approve withdrawal:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // REJECT WITHDRAWAL
  // ==========================================

  async function rejectWithdrawal(
    workerId,
    createdAt,
    amount,
    accountNumber
  ) {

    const note =
      prompt(
        "Reason for rejecting this withdrawal:"
      );


    if (note === null) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "reject_withdrawal",
          {
            p_worker_id: workerId,
            p_created_at: createdAt,
            p_amount: Number(amount),
            p_account_number: accountNumber,
            p_provider_reference: null,
            p_admin_note: note
          }
        );


      if (error) {
        throw error;
      }


      alert(
        "Withdrawal rejected and the money was returned to the worker."
      );


      await loadWithdrawals();

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not reject withdrawal:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // SUBMISSIONS
  // ==========================================

  async function loadSubmissions() {

    const container =
      document.getElementById("submissions");

    container.innerHTML =
      '<div class="loading">Loading submissions...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Submission")
        .select("*")
        .eq("status", "PENDING")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML =
        '<div class="error" style="display:block">' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }


    document.getElementById("submissionCount").textContent =
      data.length;


    if (!data.length) {

      container.innerHTML =
        '<div class="empty">No pending worker submissions.</div>';

      return;
    }


    container.innerHTML = "";


    for (const submission of data) {

      const card =
        document.createElement("div");

      card.className = "card";


      card.innerHTML = `

        <div class="row">
          <span class="label">Worker ID:</span>
          ${escapeHtml(submission.worker_id || "")}
        </div>

        <div class="row">
          <span class="label">Task ID:</span>
          ${escapeHtml(submission.task_id || "")}
        </div>

        <div class="row">
          <span class="label">Username:</span>
          ${escapeHtml(submission.username || "")}
        </div>

        <div class="row">
          <span class="label">Reward:</span>
          ₦${Number(submission.reward || 0).toLocaleString()}
        </div>

        <div class="row small">
          Submitted:
          ${
            submission.submitted_at
              ? new Date(
                  submission.submitted_at
                ).toLocaleString()
              : ""
          }
        </div>

        <div
          class="proof-box"
          id="proof_${submission.id}"
        >
          <strong>Worker Screenshot / Proof</strong>

          <div class="loading">
            Loading screenshot...
          </div>
        </div>

        <textarea
          id="submissionNote_${submission.id}"
          placeholder="Rejection note (optional)"
        ></textarea>

        <div class="buttons">

          <button
            class="action approve"
            onclick="approveSubmission('${submission.id}')"
          >
            Approve
          </button>

          <button
            class="action reject"
            onclick="rejectSubmission('${submission.id}')"
          >
            Reject
          </button>

        </div>

      `;


      container.appendChild(card);


      // Load screenshot after card is displayed.
      loadProofImage(

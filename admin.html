<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #0b8f45;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout-btn {
      background: white;
      color: #0b8f45;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #0b8f45;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .success {
      background: #e5f8ed;
      color: #087a39;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .deposit-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .deposit-item p {
      margin: 6px 0;
    }

    .btn {
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 6px;
    }

    .approve {
      background: #0b8f45;
      color: white;
    }

    .reject {
      background: #d93025;
      color: white;
    }

    .loading {
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>MoticGigs Admin</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="errorBox" class="error"></div>
  <div id="successBox" class="success"></div>

  <div class="card">
    <h2>Admin Dashboard</h2>
    <p id="welcomeMessage">Checking administrator account...</p>
  </div>

  <div class="card">
    <h2>Pending Deposits</h2>

    <div id="deposits">
      <p class="loading">Loading pending deposits...</p>
    </div>
  </div>

</div>

<script>

  // =====================================================
  // SUPABASE CONNECTION
  // =====================================================

  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // =====================================================
  // SHOW MESSAGE
  // =====================================================

  function showError(message) {
    const box = document.getElementById("errorBox");
    box.textContent = message;
    box.style.display = "block";
  }

  function showSuccess(message) {
    const box = document.getElementById("successBox");
    box.textContent = message;
    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 3000);
  }


  // =====================================================
  // CHECK ADMIN
  // =====================================================

  async function checkAdmin() {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      window.location.href = "login.html";
      return;
    }


    // IMPORTANT:
    // The Moticgigs table uses "Id" with capital I.
    // Do NOT change this to "id".

    const {
      data: profile,
      error: profileError
    } = await supabaseClient
      .from("Moticgigs")
      .select("role, status, full_name, email")
      .eq("Id", user.id)
      .single();


    if (profileError) {
      console.error(profileError);

      showError(
        "The website could not read your administrator profile. " +
        profileError.message
      );

      return;
    }


    if (!profile) {
      showError("Administrator profile was not found.");
      return;
    }


    if (profile.status === "banned") {
      showError("This administrator account has been banned.");
      await supabaseClient.auth.signOut();

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);

      return;
    }


    if (profile.role !== "admin") {
      showError("Access denied. This account is not an administrator.");

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 2000);

      return;
    }


    document.getElementById("welcomeMessage").textContent =
      "Welcome, " +
      (profile.full_name || "Administrator") +
      ". You are logged in as an administrator.";


    loadPendingDeposits();
  }


  // =====================================================
  // LOAD PENDING DEPOSITS
  // =====================================================

  async function loadPendingDeposits() {

    const depositsBox = document.getElementById("deposits");

    const {
      data: deposits,
      error
    } = await supabaseClient
      .from("Deposit")
      .select("*")
      .eq("status", "PENDING")
      .order("created_at", { ascending: false });


    if (error) {

      console.error(error);

      depositsBox.innerHTML =
        "<p>Unable to load deposits.</p>";

      return;
    }


    if (!deposits || deposits.length === 0) {

      depositsBox.innerHTML =
        "<p>No pending deposits.</p>";

      return;
    }


    depositsBox.innerHTML = "";


    deposits.forEach(deposit => {

      const item = document.createElement("div");

      item.className = "deposit-item";

      item.innerHTML = `

        <p>
          <strong>Amount:</strong>
          ₦${Number(deposit.amount || 0).toLocaleString()}
        </p>

        <p>
          <strong>Sender:</strong>
          ${escapeHtml(deposit.sender_name || "Not provided")}
        </p>

        <p>
          <strong>Reference:</strong>
          ${escapeHtml(deposit.payment_reference || "Not provided")}
        </p>

        <p>
          <strong>Payment Method:</strong>
          ${escapeHtml(deposit.payment_method || "PALMPAY")}
        </p>

        <p>
          <strong>Status:</strong>
          ${escapeHtml(deposit.status || "PENDING")}
        </p>

        <p>
          <strong>Created:</strong>
          ${deposit.created_at
            ? new Date(deposit.created_at).toLocaleString()
            : "Unknown"}
        </p>

        <br>

        <button
          class="btn approve"
          onclick="approveDeposit('${deposit.id}')">
          Approve
        </button>

        <button
          class="btn reject"
          onclick="rejectDeposit('${deposit.id}')">
          Reject
        </button>
      `;


      depositsBox.appendChild(item);

    });

  }


  // =====================================================
  // APPROVE DEPOSIT
  // =====================================================

  async function approveDeposit(id) {

    const confirmed =
      confirm("Are you sure you want to approve this deposit?");

    if (!confirmed) return;


    const {
      error
    } = await supabaseClient
      .from("Deposit")
      .update({
        status: "APPROVED",
        approved_at: new Date().toISOString()
      })
      .eq("id", id);


    if (error) {

      console.error(error);

      showError(
        "Could not approve deposit: " +
        error.message
      );

      return;
    }


    showSuccess("Deposit approved.");

    loadPendingDeposits();
  }


  // =====================================================
  // REJECT DEPOSIT
  // =====================================================

  async function rejectDeposit(id) {

    const confirmed =
      confirm("Are you sure you want to reject this deposit?");

    if (!confirmed) return;


    const {
      error
    } = await supabaseClient
      .from("Deposit")
      .update({
        status: "REJECTED",
        rejected_at: new Date().toISOString()
      })
      .eq("id", id);


    if (error) {

      console.error(error);

      showError(
        "Could not reject deposit: " +
        error.message
      );

      return;
    }


    showSuccess("Deposit rejected.");

    loadPendingDeposits();
  }


  // =====================================================
  // LOGOUT
  // =====================================================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
  }


  // =====================================================
  // BASIC HTML ESCAPE
  // =====================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // =====================================================
  // START
  // =====================================================

  checkAdmin();

</script>

</body>
</html>

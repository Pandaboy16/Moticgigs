<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoticGigs Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17211b;
}

header{
  background:#075e36;
  color:white;
  padding:18px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:20px;
}

.logout{
  border:0;
  background:white;
  color:#075e36;
  padding:9px 14px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1050px;
  margin:20px auto;
  padding:0 14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:white;
  padding:16px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.stat-title{
  color:#5d6b63;
  font-size:14px;
}

.stat-value{
  display:block;
  margin-top:5px;
  color:#075e36;
  font-size:25px;
  font-weight:bold;
}

.section{
  background:white;
  padding:16px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.section-header h2{
  margin:0;
  font-size:19px;
}

.card{
  border:1px solid #e1e8e3;
  border-radius:10px;
  padding:14px;
  margin:10px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin:8px 0;
}

.label{
  font-weight:bold;
  color:#526057;
}

.value{
  text-align:right;
  word-break:break-word;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:20px;
  background:#fff4d6;
  color:#795800;
  font-size:12px;
  font-weight:bold;
}

button.action{
  border:0;
  color:white;
  padding:10px 14px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  background:#245bdb;
}

.approve{
  background:#087a43;
}

.reject{
  background:#c62828;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.loading,
.empty,
.error,
.success{
  padding:14px;
  border-radius:8px;
}

.loading{
  background:#f2f5f3;
  color:#58645d;
}

.empty{
  background:#f2f5f3;
  color:#58645d;
}

.error{
  background:#fff0f0;
  color:#a32121;
  word-break:break-word;
}

.success{
  background:#e8f7ee;
  color:#087a43;
}

.note{
  width:100%;
  min-height:70px;
  margin-top:10px;
  padding:10px;
  border:1px solid #ccd7d0;
  border-radius:8px;
  resize:vertical;
}

.proof{
  display:block;
  width:100%;
  max-width:450px;
  max-height:500px;
  object-fit:contain;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:9px;
}

@media(max-width:650px){

  .stats{
    grid-template-columns:1fr;
  }

  .row{
    display:block;
  }

  .value{
    text-align:left;
    margin-top:4px;
  }

  header h1{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>

<h1>MoticGigs Admin Dashboard</h1>

<button class="logout" onclick="logout()">
Logout
</button>

</header>


<div class="container">


<!-- STATS -->

<div class="stats">

<div class="stat">
<div class="stat-title">
Pending Deposits
</div>

<span class="stat-value" id="depositCount">
0
</span>
</div>


<div class="stat">
<div class="stat-title">
Pending Withdrawals
</div>

<span class="stat-value" id="withdrawalCount">
0
</span>
</div>


<div class="stat">
<div class="stat-title">
Pending Submissions
</div>

<span class="stat-value" id="submissionCount">
0
</span>
</div>

</div>



<!-- DEPOSITS -->

<div class="section">

<div class="section-header">

<h2>
Pending Deposits
</h2>

<button
class="action refresh"
onclick="loadDeposits()">
Refresh
</button>

</div>

<div id="deposits">
<div class="loading">
Loading deposits...
</div>
</div>

</div>



<!-- WITHDRAWALS -->

<div class="section">

<div class="section-header">

<h2>
Pending Withdrawals
</h2>

<button
class="action refresh"
onclick="loadWithdrawals()">
Refresh
</button>

</div>

<div id="withdrawals">
<div class="loading">
Loading withdrawals...
</div>
</div>

</div>



<!-- SUBMISSIONS -->

<div class="section">

<div class="section-header">

<h2>
Pending Worker Submissions
</h2>

<button
class="action refresh"
onclick="loadSubmissions()">
Refresh
</button>

</div>

<div id="submissions">
<div class="loading">
Loading submissions...
</div>
</div>

</div>

</div>



<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =====================================================
HELPERS
===================================================== */

function money(value){

return "₦" +
Number(value || 0).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function formatDate(value){

if(!value){
return "—";
}

const date =
new Date(value);

if(
isNaN(date.getTime())
){
return escapeHtml(value);
}

return date.toLocaleString("en-NG");

}


/* =====================================================
ADMIN CHECK
===================================================== */

async function checkAdmin(){

try{

const {
data,
error
} =
await supabaseClient.auth.getUser();


if(error){

showGlobalError(
"Authentication error: " +
error.message
);

return;
}


if(!data.user){

window.location.href =
"index.html";

return;
}


const {
data:profile,
error:profileError
} =
await supabaseClient
.from("Moticgigs")
.select("role,status")
.eq("Id",data.user.id)
.single();


if(profileError){

showGlobalError(
"Could not check admin account: " +
profileError.message
);

return;
}


if(
!profile ||
profile.role !== "admin" ||
profile.status === "banned"
){

alert(
"Admin access required."
);

await supabaseClient.auth.signOut();

window.location.href =
"index.html";

return;
}


/*
IMPORTANT:
Load each section separately.
One failed query cannot block
the other sections.
*/

loadDeposits();
loadWithdrawals();
loadSubmissions();

}
catch(error){

showGlobalError(
"Dashboard error: " +
error.message
);

}

}


/* =====================================================
GLOBAL ERROR
===================================================== */

function showGlobalError(message){

document.getElementById(
"deposits"
).innerHTML =
'<div class="error">' +
escapeHtml(message) +
'</div>';

document.getElementById(
"withdrawals"
).innerHTML =
'<div class="error">' +
escapeHtml(message) +
'</div>';

document.getElementById(
"submissions"
).innerHTML =
'<div class="error">' +
escapeHtml(message) +
'</div>';

}


/* =====================================================
DEPOSITS
===================================================== */

async function loadDeposits(){

const box =
document.getElementById(
"deposits"
);

box.innerHTML =
'<div class="loading">Loading deposits...</div>';

try{

const {
data,
error
} =
await supabaseClient
.from("Deposit")
.select("*")
.eq("status","PENDING")
.order(
"created_at",
{
ascending:false
}
);


if(error){

box.innerHTML =
'<div class="error">' +
"<b>Deposit error:</b><br><br>" +
escapeHtml(error.message) +
"</div>";

document.getElementById(
"depositCount"
).textContent="!";

return;
}


document.getElementById(
"depositCount"
).textContent =
data.length;


if(!data.length){

box.innerHTML =
'<div class="empty">' +
"No pending deposits." +
"</div>";

return;
}


box.innerHTML =
data.map(
deposit => `

<div class="card">

<div class="row">
<span class="label">
Amount
</span>

<span class="value">
${money(deposit.amount)}
</span>
</div>


<div class="row">
<span class="label">
Sender Name
</span>

<span class="value">
${escapeHtml(
deposit.sender_name
)}
</span>
</div>


<div class="row">
<span class="label">
Payment Reference
</span>

<span class="value">
${escapeHtml(
deposit.payment_reference
)}
</span>
</div>


<div class="row">
<span class="label">
Payment Method
</span>

<span class="value">
${escapeHtml(
deposit.payment_method
)}
</span>
</div>


<div class="row">
<span class="label">
User ID
</span>

<span class="value">
${escapeHtml(
deposit.user_id
)}
</span>
</div>


<div class="row">
<span class="label">
Created
</span>

<span class="value">
${formatDate(
deposit.created_at
)}
</span>
</div>


<span class="status">
PENDING
</span>


<div class="actions">

<button
class="action approve"
onclick="approveDeposit('${deposit.id}')">

Approve

</button>


<button
class="action reject"
onclick="rejectDeposit('${deposit.id}')">

Reject

</button>

</div>

</div>

`
).join("");

}
catch(error){

box.innerHTML =
'<div class="error">' +
"<b>Deposit error:</b><br><br>" +
escapeHtml(error.message) +
"</div>";

}

}


/* =====================================================
APPROVE DEPOSIT
===================================================== */

async function approveDeposit(id){

if(
!confirm(
"Approve this deposit?"
)
){
return;
}


try{

const {
error
} =
await supabaseClient.rpc(
"approve_deposit",
{
deposit_id:id
}
);


if(error){

alert(
"Approval failed:\n\n" +
error.message
);

return;
}


alert(
"Deposit approved successfully."
);

loadDeposits();

}
catch(error){

alert(
"Error:\n\n" +
error.message
);

}

}


/* =====================================================
REJECT DEPOSIT
===================================================== */

async function rejectDeposit(id){

const note =
prompt(
"Enter rejection reason:"
);

if(note === null){
return;
}


try{

const {
error
} =
await supabaseClient
.from("Deposit")
.update({
status:"REJECTED",
rejected_at:
new Date().toISOString(),
admin_note:note
})
.eq("id",id)
.eq("status","PENDING");


if(error){

alert(
"Rejection failed:\n\n" +
error.message
);

return;
}


alert(
"Deposit rejected."
);

loadDeposits();

}
catch(error){

alert(
"Error:\n\n" +
error.message
);

}

}


/* =====================================================
WITHDRAWALS
===================================================== */

let withdrawals=[];


async function loadWithdrawals(){

const box =
document.getElementById(
"withdrawals"
);

box.innerHTML =
'<div class="loading">Loading withdrawals...</div>';


try{

const {
data,
error
} =
await supabaseClient
.from("Withdrawal")
.select("*")
.eq("status","PENDING")
.order(
"created_at",
{
ascending:false
}
);


if(error){

box.innerHTML =
'<div class="error">' +
"<b>Withdrawal error:</b><br><br>" +
escapeHtml(error.message) +
"</div>";

document.getElementById(
"withdrawalCount"
).textContent="!";

return;
}


withdrawals =
data || [];


document.getElementById(
"withdrawalCount"
).textContent =
withdrawals.length;


if(!withdrawals.length){

box.innerHTML =
'<div class="empty">' +
"No pending withdrawals." +
"</div>";

return;
}


box.innerHTML="";


withdrawals.forEach(
(w,index)=>{

const card =
document.createElement(
"div"
);

card.className="card";


card.innerHTML=`

<div class="row">
<span class="label">
Amount
</span>

<span class="value">
${money(w.amount)}
</span>
</div>


<div class="row">
<span class="label">
Bank
</span>

<span class="value">
${escapeHtml(
w.bank_name ||
w.bank_id ||
"—"
)}
</span>
</div>


<div class="row">
<span class="label">
Account Number
</span>

<span class="value">
${escapeHtml(
w.account_number
)}
</span>
</div>


<div class="row">
<span class="label">
Account Name
</span>

<span class="value">
${escapeHtml(
w.account_name
)}
</span>
</div>


<div class="row">
<span class="label">
Worker ID
</span>

<span class="value">
${escapeHtml(
w.worker_id
)}
</span>
</div>


<div class="row">
<span class="label">
Requested
</span>

<span class="value">
${formatDate(
w.created_at
)}
</span>
</div>


<span class="status">
PENDING
</span>


<textarea
class="note"
id="withdrawNote${index}"
placeholder="Admin note">
</textarea>


<div class="actions">

<button
class="action approve"
onclick="approveWithdrawal(${index})">

Approve / Mark Paid

</button>


<button
class="action reject"
onclick="rejectWithdrawal(${index})">

Reject & Refund

</button>

</div>

`;


box.appendChild(card);

});

}
catch(error){

box.innerHTML =
'<div class="error">' +
"<b>Withdrawal error:</b><br><br>" +
escapeHtml(error.message) +
"</div>";

}

}


/* =====================================================
APPROVE WITHDRAWAL
===================================================== */

async function approveWithdrawal(index){

const withdrawal =
withdrawals[index];


if(!withdrawal){
return;
}


if(
!confirm(
"Confirm that this withdrawal has been paid?"
)
){
return;
}


const noteElement =
document.getElementById(
"withdrawNote"+index
);


const note =
noteElement &&
noteElement.value.trim()
?
noteElement.value.trim()
:
"Withdrawal paid";


try{

const {
error
} =
await supabaseClient.rpc(
"approve_withdrawal",
{
p_worker_id:
withdrawal.worker_id,

p_created_at:
withdrawal.created_at,

p_amount:
Number(withdrawal.amount),

p_account_number:
withdrawal.account_number,

p_provider_reference:
withdrawal.provider_reference ||
null,

p_admin_note:
note
}
);


if(error){

alert(
"Withdrawal approval failed:\n\n" +
error.message
);

return;
}


alert(
"Withdrawal marked as paid."
);

loadWithdrawals();

}
catch(error){

alert(
"Error:\n\n" +
error.message
);

}

}


/* =====================================================
REJECT WITHDRAWAL
===================================================== */

async function rejectWithdrawal(index){

const withdrawal =
withdrawals[index];


if(!withdrawal){
return;
}


const noteElement =
document.getElementById(
"withdrawNote"+index
);


const note =
noteElement
?
noteElement.value.trim()
:
"";


if(!note){

alert(
"Enter a rejection reason first."
);

return;
}


if(
!confirm(
"Reject this withdrawal and refund the worker?"
)
){
return;
}


try{

const {
error
} =
await supabaseClient.rpc(
"reject_withdrawal",
{
p_worker_id:
withdrawal.worker_id,

p_created_at:
withdrawal.created_at,

p_amount:
Number(withdrawal.amount),

p_account_number:
withdrawal.account_number,

p_provider_reference:
withdrawal.provider_reference ||
null,

p_admin_note:
note
}
);


if(error){

alert(
"Withdrawal rejection failed:\n\n" +
error.message
);

return;
}


alert(
"Withdrawal rejected and refunded."
);

loadWithdrawals();

}
catch(error){

alert(
"Error:\n\n" +
error.message
);

}

}


/* =====================================================
SUBMISSIONS
===================================================== */

async function loadSubmissions(){

const box =
document.getElementById(
"submissions"
);

box.innerHTML =
'<div class="loading">Loading submissions...</div>';


try{

const {
data,
error
} =
await supabaseClient
.from("Submission")
.select("*")
.eq("status","PENDING")
.order(
"submitted_at",
{
ascending:false
}
);


if(error){

box.innerHTML =
'<div class="error">' +
"<b>Submission error:</b><br><br>" +
escapeHtml(error.message) +
"</div>";

document.getElementById(
"submissionCount"
).textContent="!";

return;
}


document.getElementById(
"submissionCount"
).textContent =
data.length;


if(!data.length){

box.innerHTML =
'<div class="empty">' +
"No pending worker submissions." +
"</div>";

return;
}


box.innerHTML="";


for(
const submission
of data
){

const card =
document.createElement(
"div"
);

card.className="card";


let proofHtml="";


if(submission.proof){

try{

const {
data:signedData,
error:signedError
} =
await supabaseClient
.storage
.from("task-proofs")
.createSignedUrl(
submission.proof,
3600
);


if(
!signedError &&
signedData &&
signedData.signedUrl
){

proofHtml=`

<div
class="label"
style="margin-top:12px">
Worker Proof
</div>

<img
class="proof"
src="${escapeHtml(
signedData.signedUrl
)}"
alt="Worker proof">

`;

}
else{

proofHtml=`

<div class="error">
Proof image could not be opened.
</div>

`;

}

}
catch(error){

proofHtml=`

<div class="error">
Proof image could not be opened.
</div>

`;

}

}


card.innerHTML=`

<div class="row">

<span class="label">
Task ID
</span>

<span class="value">
${escapeHtml(
submission.task_id
)}
</span>

</div>


<div class="row">

<span class="label">
Worker ID
</span>

<span class="value">
${escapeHtml(
submission.worker_id
)}
</span>

</div>


<div class="row">

<span class="label">
Username
</span>

<span class="value">
${escapeHtml(
submission.username
)}
</span>

</div>


<div class="row">

<span class="label">
Reward
</span>

<span class="value">
${money(
submission.reward
)}
</span>

</div>


<div class="row">

<span class="label">
Submitted
</span>

<span class="value">
${formatDate(
submission.submitted_at ||
submission.created_at
)}
</span>

</div>


${proofHtml}


<div class="actions">

<button
class="action approve"
onclick="approveSubmission('${escapeHtml(submission.id)}')">

Approve

</button>


<button
class="action reject"
onclick="rejectSubmission('${escapeHtml(submission.id)}')">

Reject

</button>

</div>

`;


box.appendChild(card);

}

}
catch(error){

box.innerHTML =
'<div class="error">' +
"<b>Submission error:</b><br><br>" +
escapeHtml(error.message) +
"</div>";

}

}


/* =====================================================
APPROVE SUBMISSION
===================================================== */

async function approveSubmission(id){

if(
!confirm(
"Approve this worker submission?"
)
){
return;
}


try{

const {
error
} =
await supabaseClient.rpc(
"approve_submission",
{
p_submission_id:id
}
);


if(error){

alert(
"Approval failed:\n\n" +
error.message
);

return;
}


alert(
"Submission approved."
);

loadSubmissions();

}
catch(error){

alert(
"Error:\n\n" +
error.message
);

}

}


/* =====================================================
REJECT SUBMISSION
===================================================== */

async function rejectSubmission(id){

const note =
prompt(
"Enter rejection reason:"
);


if(
note === null ||
!note.trim()
){
return;
}


try{

const {
error
} =
await supabaseClient.rpc(
"reject_submission",
{
p_submission_id:id,
p_rejection_note:
note.trim()
}
);


if(error){

alert(
"Rejection failed:\n\n" +
error.message
);

return;
}


alert(
"Submission rejected."
);

loadSubmissions();

}
catch(error){

alert(
"Error:\n\n" +
error.message
);

}

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

await supabaseClient.auth.signOut();

window.location.href =
"index.html";

}


/* =====================================================
START
===================================================== */

checkAdmin();

</script>

</body>
</html>

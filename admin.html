<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header button {
      background: #dc2626;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      white-space: pre-wrap;
    }

    .section {
      background: white;
      margin-bottom: 25px;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .section h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .count {
      background: #111827;
      color: white;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .row {
      margin: 7px 0;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button.action {
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .approve:hover {
      background: #15803d;
    }

    .reject:hover {
      background: #b91c1c;
    }

    .loading {
      color: #6b7280;
      padding: 10px 0;
    }

    .empty {
      color: #6b7280;
      padding: 10px 0;
    }

    .proof-box {
      margin-top: 15px;
      padding: 12px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .proof-box img {
      width: 100%;
      max-width: 450px;
      max-height: 600px;
      object-fit: contain;
      display: block;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #f9fafb;
      cursor: pointer;
    }

    .proof-link {
      display: inline-block;
      margin-top: 8px;
      color: #2563eb;
      text-decoration: none;
    }

    .small {
      color: #6b7280;
      font-size: 13px;
    }

    textarea {
      width: 100%;
      min-height: 75px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      resize: vertical;
      margin-top: 10px;
      font-family: Arial, sans-serif;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 9999;
      padding: 15px;
      overflow: auto;
    }

    .modal-content {
      background: white;
      max-width: 750px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
    }

    .modal-content img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      background: #111;
      border-radius: 8px;
    }

    .close {
      float: right;
      background: #111827;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Admin Dashboard - MoticGigs</h1>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="globalError" class="error"></div>

  <div class="status">
    <strong>Admin status:</strong>
    <span id="adminStatus">Checking...</span>
  </div>


  <!-- ========================= -->
  <!-- PENDING DEPOSITS -->
  <!-- ========================= -->

  <div class="section">

    <h2>
      Pending Deposits
      <span id="depositCount" class="count">0</span>
    </h2>

    <div id="deposits">
      <div class="loading">Loading deposits...</div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- PENDING WITHDRAWALS -->
  <!-- ========================= -->

  <div class="section">

    <h2>
      Pending Withdrawals
      <span id="withdrawalCount" class="count">0</span>
    </h2>

    <div id="withdrawals">
      <div class="loading">Loading withdrawals...</div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- PENDING SUBMISSIONS -->
  <!-- ========================= -->

  <div class="section">

    <h2>
      Pending Worker Submissions
      <span id="submissionCount" class="count">0</span>
    </h2>

    <div id="submissions">
      <div class="loading">Loading submissions...</div>
    </div>

  </div>

</div>


<!-- ========================= -->
<!-- SCREENSHOT MODAL -->
<!-- ========================= -->

<div id="imageModal" class="modal">

  <div class="modal-content">

    <button class="close" onclick="closeImage()">
      Close
    </button>

    <h3>Worker Screenshot</h3>

    <img
      id="modalImage"
      src=""
      alt="Worker screenshot"
    >

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL =
    "https://jfoijwjqfaewzyzjawbw.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // SHOW ERROR
  // ==========================================

  function showError(message) {

    const box =
      document.getElementById("globalError");

    box.style.display = "block";

    box.textContent = message;
  }


  function clearError() {

    const box =
      document.getElementById("globalError");

    box.style.display = "none";

    box.textContent = "";
  }


  // ==========================================
  // CHECK ADMIN
  // ==========================================

  async function checkAdmin() {

    try {

      clearError();

      document.getElementById("adminStatus").textContent =
        "Checking login...";


      const {
        data: userData,
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError) {
        throw userError;
      }


      if (!userData || !userData.user) {

        document.getElementById("adminStatus").textContent =
          "Not logged in";

        showError(
          "No active Supabase login session was found."
        );

        return;
      }


      const user =
        userData.user;


      document.getElementById("adminStatus").textContent =
        "Checking administrator account...";


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("Moticgigs")
          .select("role,status")
          .eq("Id", user.id)
          .single();


      if (profileError) {
        throw profileError;
      }


      if (!profile) {

        throw new Error(
          "Admin profile was not found."
        );

      }


      if (profile.role !== "admin") {

        document.getElementById("adminStatus").textContent =
          "Access denied";

        showError(
          "Your Moticgigs role is '" +
          profile.role +
          "', not 'admin'."
        );

        return;
      }


      if (profile.status === "banned") {

        document.getElementById("adminStatus").textContent =
          "Banned";

        showError(
          "This administrator account is banned."
        );

        return;
      }


      document.getElementById("adminStatus").textContent =
        "Active administrator";


      // Load independently.
      loadDeposits();
      loadWithdrawals();
      loadSubmissions();

    }

    catch (error) {

      console.error(
        "ADMIN CHECK ERROR:",
        error
      );

      document.getElementById("adminStatus").textContent =
        "Error";

      showError(
        "Admin check failed:\n\n" +
        (error.message ||
         JSON.stringify(error))
      );

    }

  }


  // ==========================================
  // LOAD DEPOSITS
  // ==========================================

  async function loadDeposits() {

    const container =
      document.getElementById("deposits");

    container.innerHTML =
      '<div class="loading">Loading deposits...</div>';


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("Deposit")
          .select("*")
          .eq("status", "PENDING")
          .order("created_at", {
            ascending: false
          });


      if (error) {
        throw error;
      }


      document.getElementById(
        "depositCount"
      ).textContent = data.length;


      if (!data.length) {

        container.innerHTML =
          '<div class="empty">' +
          'No pending deposits.' +
          '</div>';

        return;
      }


      container.innerHTML = "";


      data.forEach(deposit => {

        const card =
          document.createElement("div");

        card.className = "card";


        card.innerHTML = `

          <div class="row">
            <span class="label">Amount:</span>
            ₦${Number(
              deposit.amount || 0
            ).toLocaleString()}
          </div>

          <div class="row">
            <span class="label">Sender:</span>
            ${escapeHtml(
              deposit.sender_name || ""
            )}
          </div>

          <div class="row">
            <span class="label">Reference:</span>
            ${escapeHtml(
              deposit.payment_reference || ""
            )}
          </div>

          <div class="row">
            <span class="label">Payment Method:</span>
            ${escapeHtml(
              deposit.payment_method || ""
            )}
          </div>

          <div class="row small">
            Created:
            ${
              deposit.created_at
              ? new Date(
                  deposit.created_at
                ).toLocaleString()
              : ""
            }
          </div>

          <textarea
            id="depositNote_${deposit.id}"
            placeholder="Admin note (optional)"
          ></textarea>

          <div class="buttons">

            <button
              class="action approve"
              onclick="approveDeposit('${deposit.id}')"
            >
              Approve
            </button>

            <button
              class="action reject"
              onclick="rejectDeposit('${deposit.id}')"
            >
              Reject
            </button>

          </div>

        `;


        container.appendChild(card);

      });

    }

    catch (error) {

      console.error(
        "DEPOSIT ERROR:",
        error
      );

      container.innerHTML =
        '<div class="error" style="display:block">' +
        escapeHtml(
          error.message ||
          "Could not load deposits."
        ) +
        '</div>';

    }

  }


  // ==========================================
  // APPROVE DEPOSIT
  // ==========================================

  async function approveDeposit(id) {

    if (
      !confirm(
        "Approve this deposit?"
      )
    ) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "approve_deposit",
          {
            deposit_id: id
          }
        );


      if (error) {
        throw error;
      }


      alert(
        "Deposit approved successfully."
      );


      await loadDeposits();

    }

    catch (error) {

      console.error(
        "APPROVE DEPOSIT ERROR:",
        error
      );

      alert(
        "Could not approve deposit:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // REJECT DEPOSIT
  // ==========================================

  async function rejectDeposit(id) {

    const note =
      document.getElementById(
        "depositNote_" + id
      )?.value || "";


    if (
      !confirm(
        "Reject this deposit?"
      )
    ) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "reject_deposit",
          {
            p_deposit_id: id,
            p_admin_note: note
          }
        );


      if (error) {
        throw error;
      }


      alert(
        "Deposit rejected."
      );


      await loadDeposits();

    }

    catch (error) {

      console.error(
        "REJECT DEPOSIT ERROR:",
        error
      );

      alert(
        "Could not reject deposit:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // LOAD WITHDRAWALS
  // ==========================================

  async function loadWithdrawals() {

    const container =
      document.getElementById("withdrawals");

    container.innerHTML =
      '<div class="loading">Loading withdrawals...</div>';


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("Withdrawal")
          .select("*")
          .eq("status", "PENDING")
          .order("created_at", {
            ascending: false
          });


      if (error) {
        throw error;
      }


      document.getElementById(
        "withdrawalCount"
      ).textContent = data.length;


      if (!data.length) {

        container.innerHTML =
          '<div class="empty">' +
          'No pending withdrawals.' +
          '</div>';

        return;
      }


      container.innerHTML = "";


      data.forEach(withdrawal => {

        const card =
          document.createElement("div");

        card.className = "card";


        const workerId =
          withdrawal.worker_id || "";

        const createdAt =
          withdrawal.created_at || "";

        const amount =
          Number(
            withdrawal.amount || 0
          );

        const accountNumber =
          withdrawal.account_number || "";


        card.innerHTML = `

          <div class="row">
            <span class="label">Amount:</span>
            ₦${amount.toLocaleString()}
          </div>

          <div class="row">
            <span class="label">Worker ID:</span>
            ${escapeHtml(workerId)}
          </div>

          <div class="row">
            <span class="label">Bank:</span>
            ${escapeHtml(
              withdrawal.bank_name || ""
            )}
          </div>

          <div class="row">
            <span class="label">Account Number:</span>
            ${escapeHtml(
              accountNumber
            )}
          </div>

          <div class="row">
            <span class="label">Account Name:</span>
            ${escapeHtml(
              withdrawal.account_name || ""
            )}
          </div>

          <div class="row small">
            Created:
            ${
              createdAt
              ? new Date(
                  createdAt
                ).toLocaleString()
              : ""
            }
          </div>

          <div class="buttons">

            <button
              class="action approve"
              onclick="approveWithdrawal(
                '${escapeJs(workerId)}',
                '${escapeJs(createdAt)}',
                ${amount},
                '${escapeJs(accountNumber)}'
              )"
            >
              Approve
            </button>

            <button
              class="action reject"
              onclick="rejectWithdrawal(
                '${escapeJs(workerId)}',
                '${escapeJs(createdAt)}',
                ${amount},
                '${escapeJs(accountNumber)}'
              )"
            >
              Reject
            </button>

          </div>

        `;


        container.appendChild(card);

      });

    }

    catch (error) {

      console.error(
        "WITHDRAWAL ERROR:",
        error
      );

      container.innerHTML =
        '<div class="error" style="display:block">' +
        escapeHtml(
          error.message ||
          "Could not load withdrawals."
        ) +
        '</div>';

    }

  }


  // ==========================================
  // APPROVE WITHDRAWAL
  // ==========================================

  async function approveWithdrawal(
    workerId,
    createdAt,
    amount,
    accountNumber
  ) {

    if (
      !confirm(
        "Approve this withdrawal?"
      )
    ) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "approve_withdrawal",
          {
            p_worker_id: workerId,
            p_created_at: createdAt,
            p_amount: Number(amount),
            p_account_number: accountNumber,
            p_provider_reference: null,
            p_admin_note: null
          }
        );


      if (error) {
        throw error;
      }


      alert(
        "Withdrawal approved successfully."
      );


      await loadWithdrawals();

    }

    catch (error) {

      console.error(
        "APPROVE WITHDRAWAL ERROR:",
        error
      );

      alert(
        "Could not approve withdrawal:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // REJECT WITHDRAWAL
  // ==========================================

  async function rejectWithdrawal(
    workerId,
    createdAt,
    amount,
    accountNumber
  ) {

    const note =
      prompt(
        "Reason for rejecting this withdrawal:"
      );


    if (note === null) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "reject_withdrawal",
          {
            p_worker_id: workerId,
            p_created_at: createdAt,
            p_amount: Number(amount),
            p_account_number: accountNumber,
            p_provider_reference: null,
            p_admin_note: note
          }
        );


      if (error) {
        throw error;
      }


      alert(
        "Withdrawal rejected.\n\n" +
        "The money has been returned to the worker's available balance."
      );


      await loadWithdrawals();

    }

    catch (error) {

      console.error(
        "REJECT WITHDRAWAL ERROR:",
        error
      );

      alert(
        "Could not reject withdrawal:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // LOAD SUBMISSIONS
  // ==========================================

  async function loadSubmissions() {

    const container =
      document.getElementById("submissions");

    container.innerHTML =
      '<div class="loading">Loading submissions...</div>';


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("Submission")
          .select("*")
          .eq("status", "PENDING")
          .order("created_at", {
            ascending: false
          });


      if (error) {
        throw error;
      }


      document.getElementById(
        "submissionCount"
      ).textContent = data.length;


      if (!data.length) {

        container.innerHTML =
          '<di

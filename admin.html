<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f6;
      color: #222;
    }

    header {
      background: #075e3d;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout {
      background: #fff;
      color: #075e3d;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-top: 0;
      color: #075e3d;
    }

    .message {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #dff5e8;
      color: #126b3e;
    }

    .error {
      background: #ffe1e1;
      color: #a30000;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-top: 0;
      color: #075e3d;
    }

    .deposit-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .deposit-card p {
      margin: 7px 0;
      word-break: break-word;
    }

    .amount {
      font-size: 21px;
      font-weight: bold;
      color: #075e3d;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #075e3d;
      color: white;
    }

    .approve:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .reject {
      background: #c62828;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 0 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MoticGigs Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <div class="welcome">
    <h2>Admin Dashboard</h2>
    <p id="adminInfo">Checking administrator account...</p>
  </div>

  <div class="section">
    <h2>Pending Deposits</h2>

    <div id="deposits">
      <div class="loading">Loading deposits...</div>
    </div>
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://jfoijwjqfaewzyzjawbw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  // ---------------------------------------
  // MESSAGE
  // ---------------------------------------

  function showMessage(text, type) {

    const message = document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // ---------------------------------------
  // ADMIN CHECK
  // ---------------------------------------

  async function checkAdmin() {

    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (
      sessionError ||
      !sessionData ||
      !sessionData.session
    ) {

      window.location.href = "login.html";
      return;

    }

    const user =
      sessionData.session.user;


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("Moticgigs")
        .select('"Id", email, full_name, role, status')
        .eq("Id", user.id)
        .maybeSingle();


    if (profileError) {

      console.error(profileError);

      showMessage(
        "Could not read your administrator profile.",
        "error"
      );

      return;
    }


    if (!profile) {

      showMessage(
        "Administrator profile was not found.",
        "error"
      );

      return;
    }


    if (profile.role !== "admin") {

      showMessage(
        "Access denied. Administrator account required.",
        "error"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 2000);

      return;
    }


    if (profile.status === "banned") {

      showMessage(
        "This administrator account is banned.",
        "error"
      );

      await supabaseClient.auth.signOut();

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);

      return;
    }


    document.getElementById("adminInfo").textContent =
      "Logged in as administrator: " +
      (profile.full_name || profile.email);


    loadDeposits();
  }


  // ---------------------------------------
  // LOAD DEPOSITS
  // ---------------------------------------

  async function loadDeposits() {

    const container =
      document.getElementById("deposits");

    container.innerHTML =
      '<div class="loading">Loading deposits...</div>';


    const {
      data: deposits,
      error
    } =
      await supabaseClient
        .from("Deposit")
        .select("*")
        .eq("status", "PENDING")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML = "";

      showMessage(
        "Could not load deposits: " +
        error.message,
        "error"
      );

      return;
    }


    if (!deposits || deposits.length === 0) {

      container.innerHTML =
        '<div class="empty">No pending deposits.</div>';

      return;
    }


    container.innerHTML = "";


    deposits.forEach(deposit => {

      // IMPORTANT:
      // Deposit table now uses lowercase "id"

      const depositId =
        deposit.id;


      const card =
        document.createElement("div");

      card.className =
        "deposit-card";


      card.innerHTML = `

        <p class="amount">
          ₦${Number(deposit.amount || 0).toLocaleString()}
        </p>

        <p>
          <strong>Sender:</strong>
          ${escapeHtml(deposit.sender_name || "N/A")}
        </p>

        <p>
          <strong>Payment Method:</strong>
          ${escapeHtml(deposit.payment_method || "N/A")}
        </p>

        <p>
          <strong>Reference:</strong>
          ${escapeHtml(deposit.payment_reference || "N/A")}
        </p>

        <p>
          <strong>User ID:</strong>
          ${escapeHtml(deposit.user_id || "N/A")}
        </p>

        <p>
          <strong>Submitted:</strong>
          ${deposit.created_at
            ? new Date(deposit.created_at).toLocaleString()
            : "N/A"}
        </p>

        <div class="buttons">

          <button
            class="approve"
            id="approve-${depositId}">
            Approve Deposit
          </button>

          <button
            class="reject"
            id="reject-${depositId}">
            Reject
          </button>

        </div>
      `;


      container.appendChild(card);


      document
        .getElementById("approve-" + depositId)
        .addEventListener(
          "click",
          () => approveDeposit(depositId)
        );


      document
        .getElementById("reject-" + depositId)
        .addEventListener(
          "click",
          () => rejectDeposit(depositId)
        );

    });
  }


  // ---------------------------------------
  // APPROVE DEPOSIT
  // ---------------------------------------

  async function approveDeposit(id) {

    if (!id) {

      showMessage(
        "Deposit ID is missing.",
        "error"
      );

      return;
    }


    const confirmed =
      confirm(
        "Approve this deposit?\n\n" +
        "The deposit amount will automatically be added to the user's available wallet balance."
      );


    if (!confirmed) {
      return;
    }


    const button =
      document.getElementById(
        "approve-" + id
      );


    if (button) {

      button.disabled = true;
      button.textContent = "Approving...";

    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "approve_deposit",
        {
          deposit_id: id
        }
      );


    if (error) {

      console.error(
        "Approve error:",
        error
      );


      if (button) {

        button.disabled = false;
        button.textContent =
          "Approve Deposit";

      }


      showMessage(
        "Could not approve deposit: " +
        error.message,
        "error"
      );

      return;
    }


    console.log(
      "Deposit approved:",
      data
    );


    showMessage(
      "Deposit approved successfully. The amount has been added to the user's available balance.",
      "success"
    );


    // Reload pending deposits
    await loadDeposits();

  }


  // ---------------------------------------
  // REJECT DEPOSIT
  // ---------------------------------------

  async function rejectDeposit(id) {

    if (!id) {

      showMessage(
        "Deposit ID is missing.",
        "error"
      );

      return;
    }


    const confirmed =
      confirm(
        "Are you sure you want to reject this deposit?"
      );


    if (!confirmed) {
      return;
    }


    const button =
      document.getElementById(
        "reject-" + id
      );


    if (button) {

      button.disabled = true;
      button.textContent = "Rejecting...";

    }


    /*
      NOTE:
      Rejection will be connected to a secure
      reject_deposit RPC in the next backend step.
    */

    if (button) {

      button.disabled = false;
      button.textContent = "Reject";

    }


    showMessage(
      "The Reject function needs its secure backend RPC before it can process the deposit.",
      "error"
    );

  }


  // ---------------------------------------
  // HTML ESCAPE
  // ---------------------------------------

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ---------------------------------------
  // LOGOUT
  // ---------------------------------------

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

  }


  // ---------------------------------------
  // START
  // ---------------------------------------

  checkAdmin();

</script>

</body>
</html>

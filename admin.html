/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   HELPERS
========================================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showError(message){

  const box =
    document.getElementById("globalError");

  box.style.display = "block";

  box.textContent = message;
}


function clearError(){

  const box =
    document.getElementById("globalError");

  box.style.display = "none";

  box.textContent = "";
}


/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin(){

  try{

    clearError();

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();

    if(error){
      throw error;
    }

    if(!data.user){

      document.getElementById(
        "adminStatus"
      ).textContent = "Not logged in";

      showError("No active login session.");

      return;
    }

    const user = data.user;


    const {
      data:profile,
      error:profileError
    } =
    await supabaseClient
      .from("Moticgigs")
      .select("role,status")
      .eq("Id",user.id)
      .single();


    if(profileError){
      throw profileError;
    }


    if(
      !profile ||
      profile.role !== "admin" ||
      profile.status === "banned"
    ){

      document.getElementById(
        "adminStatus"
      ).textContent = "Access denied";

      showError(
        "This account is not an active administrator."
      );

      return;
    }


    document.getElementById(
      "adminStatus"
    ).textContent = "Active administrator";


    await loadDeposits();
    await loadWithdrawals();
    await loadSubmissions();

  }
  catch(error){

    console.error(error);

    document.getElementById(
      "adminStatus"
    ).textContent = "Error";

    showError(
      "Admin check failed:\n\n" +
      error.message
    );

  }
}


/* =========================================
   DEPOSITS
========================================= */

async function loadDeposits(){

  const box =
    document.getElementById("deposits");

  box.innerHTML =
    '<div class="loading">Loading deposits...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
    .from("Deposit")
    .select("*")
    .eq("status","PENDING")
    .order("created_at",{ascending:false});


  if(error){

    box.innerHTML =
      '<div class="error" style="display:block">' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }


  document.getElementById(
    "depositCount"
  ).textContent = data.length;


  if(data.length === 0){

    box.innerHTML =
      '<div class="empty">No pending deposits.</div>';

    return;
  }


  box.innerHTML = "";


  data.forEach(deposit => {

    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div class="row">
        <span class="label">Amount:</span>
        ₦${Number(deposit.amount || 0).toLocaleString()}
      </div>

      <div class="row">
        <span class="label">Sender:</span>
        ${escapeHtml(deposit.sender_name)}
      </div>

      <div class="row">
        <span class="label">Reference:</span>
        ${escapeHtml(deposit.payment_reference)}
      </div>

      <div class="row">
        <span class="label">Method:</span>
        ${escapeHtml(deposit.payment_method)}
      </div>

      <div class="row">
        <span class="label">Created:</span>
        ${
          deposit.created_at
          ? new Date(deposit.created_at).toLocaleString()
          : ""
        }
      </div>

      <textarea
        id="depositNote_${deposit.id}"
        placeholder="Admin note (optional)"
      ></textarea>

      <div class="buttons">

        <button
          class="action approve"
          onclick="approveDeposit('${deposit.id}')"
        >
          Approve
        </button>

        <button
          class="action reject"
          onclick="rejectDeposit('${deposit.id}')"
        >
          Reject
        </button>

      </div>

    `;

    box.appendChild(card);

  });

}


/* =========================================
   APPROVE DEPOSIT
========================================= */

async function approveDeposit(id){

  if(!confirm("Approve this deposit?")){
    return;
  }


  const {
    error
  } =
  await supabaseClient.rpc(
    "approve_deposit",
    {
      deposit_id:id
    }
  );


  if(error){

    alert(
      "Could not approve deposit:\n\n" +
      error.message
    );

    return;
  }


  alert("Deposit approved successfully.");

  await loadDeposits();

}


/* =========================================
   REJECT DEPOSIT
========================================= */

async function rejectDeposit(id){

  const note =
    document.getElementById(
      "depositNote_" + id
    )?.value || "";


  if(!confirm("Reject this deposit?")){
    return;
  }


  const {
    error
  } =
  await supabaseClient.rpc(
    "reject_deposit",
    {
      p_deposit_id:id,
      p_admin_note:note
    }
  );


  if(error){

    alert(
      "Could not reject deposit:\n\n" +
      error.message
    );

    return;
  }


  alert("Deposit rejected.");

  await loadDeposits();

}

/* =========================================
   LOAD SCREENSHOT
========================================= */

async function loadProof(
  submissionId,
  proof
){

  const box =
    document.getElementById(
      "proof_" + submissionId
    );


  if(!box){
    return;
  }


  if(!proof){

    box.innerHTML += `
      <div style="margin-top:10px;color:#991b1b">
        No screenshot/proof was submitted.
      </div>
    `;

    return;
  }


  try{

    let path = proof;


    /*
      If the Submission.proof column
      contains a full Supabase URL,
      extract the storage path.
    */

    if(
      proof.startsWith("http://") ||
      proof.startsWith("https://")
    ){

      const marker =
        "/storage/v1/object/";

      const position =
        proof.indexOf(marker);


      if(position !== -1){

        path =
          proof.substring(
            position + marker.length
          );

        path =
          path.replace(
            /^sign\/task-proofs\//,
            ""
          );

        path =
          path.replace(
            /^authenticated\/task-proofs\//,
            ""
          );

        path =
          path.replace(
            /^public\/task-proofs\//,
            ""
          );

        path =
          path.split("?")[0];

      }
      else{

        box.innerHTML = `

          <strong>Worker Screenshot</strong>

          <img
            src="${escapeHtml(proof)}"
            alt="Worker screenshot"
            onclick="openImage('${escapeHtml(proof)}')"
          >

          <a
            href="${escapeHtml(proof)}"
            target="_blank"
          >
            Open screenshot
          </a>

        `;

        return;
      }

    }


    /*
      Create a signed URL from
      the private task-proofs bucket.
    */

    const {
      data,
      error
    } =
    await supabaseClient.storage
      .from("task-proofs")
      .createSignedUrl(
        path,
        3600
      );


    if(error){
      throw error;
    }


    if(
      !data ||
      !data.signedUrl
    ){

      throw new Error(
        "Could not create screenshot URL."
      );

    }


    const imageUrl =
      data.signedUrl;


    box.innerHTML = `

      <strong>Worker Screenshot</strong>

      <img
        src="${imageUrl}"
        alt="Worker screenshot"
        onclick="openImage('${imageUrl}')"
      >

      <a
        href="${imageUrl}"
        target="_blank"
      >
        Open screenshot
      </a>

      <div style="font-size:13px;color:#6b7280;margin-top:7px">
        Tap the screenshot to view it larger.
      </div>

    `;

  }
  catch(error){

    console.error(
      "Screenshot error:",
      error
    );


    box.innerHTML = `

      <strong>Worker Screenshot</strong>

      <div style="
        color:#991b1b;
        margin-top:10px;
      ">

        Could not load screenshot.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}

  const {

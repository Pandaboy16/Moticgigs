<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Admin Dashboard - MoticGigs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{

}

header{

header h1{

}

header small{

}

button{

.logout{

.container{

.status{

.section{
  background:white;
  padding:18px;

.section h2{

.card{

.row{

.label{

.amount{

.loading{

}

.empty{
  background:#f5f5f5;
  padding:13px;

  color:#666;
}

.error{
  background:#fff0f0;
  color:#c62828;
  padding:13px;
  border-radius:8px;
  white-space:pre-wrap;
}

.ok{
  color:#087f23;
  font-weight:bold;
}

.approve{
  background:#159447;
  color:white;
  margin:5px 5px 0 0;
}

.reject{

  color:white;

</head>

<body>

<header>

    <h1>Admin Dashboard</h1>
    <small id="adminStatus">Checking administrator...</small>

  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="status" id="systemStatus">
    Connecting to MoticGigs...
  </div>

  <!-- DEPOSITS -->
  <div class="section">
    <h2>💰 Pending Deposits</h2>

      <div class="loading">Loading deposits...</div>

    </div>

      Refresh Withdrawals
    </button>
  </div>

  <!-- SUBMISSIONS -->
  <div class="section">
    <h2>📸 Pending Worker Submissions</h2>

    <div id="submissionList">
      <div class="loading">Loading submissions...</div>
    </div>

    <button class="refresh" onclick="loadSubmissions()">
      Refresh Submissions
    </button>
  </div>

</div>

<!-- IMAGE MODAL -->
<div class="modal" id="imageModal" onclick="closeImage()">
  <span class="close">&times;</span>
  <img id="modalImage" src="" alt="Proof">
</div>

<script>

const SUPABASE_URL =
"https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================
   HELPERS
========================= */

function money(value){
  return "₦" + Number(value || 0).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function date(value){
  if(!value) return "N/A";

  return new Date(value).toLocaleString(
    "en-NG"
  );
}

function safe(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  const adminStatus =
    document.getElementById("adminStatus");

  const systemStatus =
    document.getElementById("systemStatus");

  try{

    systemStatus.textContent =
      "Checking logged-in account...";

    const {
      data:userData,
      error:userError
    } =
    await supabaseClient.auth.getUser();

    if(userError){
      throw new Error(
        "Authentication error: " +
        userError.message
      );
    }

    if(!userData || !userData.user){

      adminStatus.textContent =
        "Not logged in";

      systemStatus.innerHTML =
        '<span class="error">❌ No logged-in user found.</span>';

      return;
    }

    const user =
      userData.user;

    systemStatus.textContent =
      "Checking administrator profile...";

    const {
      data:profile,
      error:profileError
    } =
    await supabaseClient
      .from("Moticgigs")
      .select("role,status,email")
      .eq("Id",user.id)
      .single();

    if(profileError){
      throw new Error(
        "Profile error: " +
        profileError.message
      );
    }

    if(!profile){

      throw new Error(
        "Administrator profile not found."
      );
    }

    if(profile.role !== "admin"){

      adminStatus.textContent =
        "Not an administrator";

      systemStatus.innerHTML =
        '<span class="error">❌ This account is not an administrator.</span>';

      return;
    }

    if(profile.status !== "active"){

      adminStatus.textContent =
        "Administrator inactive";

      systemStatus.innerHTML =
        '<span class="error">❌ Administrator account is not active.</span>';

      return;
    }

    adminStatus.textContent =
      "Active administrator";

    systemStatus.innerHTML =
      '<span class="ok">✅ Administrator authenticated successfully.</span>';

    /*
      Start each section separately.
    */

    loadDeposits();
    loadWithdrawals();
    loadSubmissions();

  }
  catch(error){

    console.error(error);

    adminStatus.textContent =
      "Admin check failed";

    systemStatus.innerHTML =
      '<div class="error">❌ ' +
      safe(error.message) +
      '</div>';
  }
}


/* =========================
   DEPOSITS
========================= */

async function loadDeposits(){

  const box =
    document.getElementById("depositList");

  box.innerHTML =
    '<div class="loading">Loading deposits...</div>';

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("Deposit")
      .select("*")
      .eq("status","PENDING")
      .order("created_at",{ascending:false});

    if(error) throw error;

    if(!data || data.length === 0){

      box.innerHTML =
        '<div class="empty">No pending deposits.</div>';

      return;
    }

    box.innerHTML = "";

    data.forEach(d => {

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `

        <div class="amount">
          ${money(d.amount)}
        </div>

        <div class="row">
          <span class="label">User ID:</span>
          ${safe(d.user_id)}
        </div>

        <div class="row">
          <span class="label">Sender:</span>
          ${safe(d.sender_name || "N/A")}
        </div>

        <div class="row">
          <span class="label">Payment Method:</span>
          ${safe(d.payment_method || "N/A")}
        </div>

        <div class="row">
          <span class="label">Reference:</span>
          ${safe(d.payment_reference || "N/A")}
        </div>

        <div class="row">
          <span class="label">Created:</span>
          ${date(d.created_at)}
        </div>

        <button
          class="approve"
          onclick="approveDeposit('${d.id}')">
          ✅ Approve
        </button>

        <button
          class="reject"
          onclick="rejectDeposit('${d.id}')">
          ❌ Reject
        </button>
      `;

      box.appendChild(card);
    });

  }
  catch(error){

    console.error(error);

    box.innerHTML =
      '<div class="error">❌ Could not load deposits:\n' +
      safe(error.message) +
      '</div>';
  }
}


/* =========================
   APPROVE DEPOSIT
========================= */

async function approveDeposit(id){

  if(!confirm(
    "Approve this deposit?\n\nThe amount will be added to the advertiser's available balance."
  )){
    return;
  }

  try{

    const {error} =
      await supabaseClient.rpc(
        "approve_deposit",
        {
          deposit_id:id
        }
      );

    if(error) throw error;

    alert("Deposit approved successfully.");

    loadDeposits();

  }
  catch(error){

    alert(
      "Could not approve deposit:\n\n" +
      error.message
    );
  }
}


/* =========================
   REJECT DEPOSIT
========================= */

async function rejectDeposit(id){

  const note =
    prompt("Enter rejection reason:");

  if(note === null) return;

  try{

    const {error} =
      await supabaseClient.rpc(
        "reject_deposit",
        {
          p_deposit_id:id,
          p_admin_note:note
        }
      );

    if(error) throw error;

    alert("Deposit rejected.");

    loadDeposits();

  }
  catch(error){

    alert(
      "Could not reject deposit:\n\n" +
      error.message
    );
  }
}

/* =========================

========================= */

/* =========================
   PROOF SCREENSHOT
========================= */

async function loadProof(
  proof,
  elementId
){

  const box =
    document.getElementById(elementId);

  if(!proof){

    box.innerHTML =
      '<div class="error">No screenshot/proof submitted.</div>';

    return;
  }

  try{

    let path = proof;

    /*
      If proof is a full Storage URL,
      extract the object path.
    */

    if(
      path.startsWith("http://") ||
      path.startsWith("https://")
    ){

      const marker =
        "/storage/v1/object/";

      const position =
        path.indexOf(marker);

      if(position !== -1){

        path =
          path.substring(
            position + marker.length
          );

        path =
          path
            .replace(
              /^sign\/task-proofs\//,
              ""
            )
            .replace(
              /^public\/task-proofs\//,
              ""
            )
            .replace(
              /^authenticated\/task-proofs\//,
              ""
            )
            .replace(
              /^task-proofs\//,
              ""
            );
      }
    }

    path =
      path.replace(
        /^task-proofs\//,
        ""
      );

    const {
      data,
      error
    } =
    await supabaseClient
      .storage
      .from("task-proofs")
      .createSignedUrl(
        path,
        3600
      );

    if(error) throw error;

    if(!data || !data.signedUrl){

      throw new Error(
        "Could not create screenshot URL."
      );
    }

    box.innerHTML = `

      <div class="row">
        <span class="label">
          Proof Screenshot:
        </span>
      </div>

      <img
        class="proof"
        src="${safe(data.signedUrl)}"
        alt="Worker proof screenshot"
        onclick="openImage('${safe(data.signedUrl)}')"
      >
    `;

  }
  catch(error){

    console.error(error);

    box.innerHTML =
      '<div class="error">❌ Could not load screenshot:\n' +
      safe(error.message) +
      '</div>';
  }
}

/* =========================
   IMAGE MODAL
========================= */

function openImage(url){

  document.getElementById(
    "modalImage"
  ).src = url;

  document.getElementById(
    "imageModal"
  ).style.display = "flex";
}

function closeImage(){

  document.getElementById(
    "imageModal"
  ).style.display = "none";

  document.getElementById(

/* =========================
   LOGOUT
========================= */

async function logout(){

/* =========================
   START
========================= */

checkAdmin();

</script>
<script src="/pwa.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f6;
      color: #222;
    }

    header {
      background: #075e3d;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    .logout {
      background: white;
      color: #075e3d;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .success {
      background: #dff5e8;
      color: #126b3e;
    }

    .error {
      background: #ffe0e0;
      color: #a00000;
    }

    .welcome,
    .section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .welcome h2,
    .section h2 {
      margin-top: 0;
      color: #075e3d;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .card p {
      margin: 7px 0;
      word-break: break-word;
    }

    .amount {
      font-size: 21px;
      font-weight: bold;
      color: #075e3d;
    }

    .proof {
      width: 100%;
      max-width: 350px;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-top: 10px;
      background: #f5f5f5;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button.action {
      border: none;
      padding: 11px 17px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve {
      background: #075e3d;
      color: white;
    }

    .reject {
      background: #c62828;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .note-input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 14px;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .tag {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      background: #eef5f1;
      color: #075e3d;
      font-size: 12px;
      font-weight: bold;
    }

    a.task-link {
      color: #075e3d;
      word-break: break-all;
    }
  </style>
</head>

<body>

<header>
  <h1>MoticGigs Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <div class="welcome">
    <h2>Admin Dashboard</h2>
    <p id="adminInfo">Checking administrator account...</p>
  </div>


  <!-- ========================= -->
  <!-- PENDING DEPOSITS -->
  <!-- ========================= -->

  <div class="section">

    <h2>Pending Deposits</h2>

    <div id="deposits">
      <div class="loading">Loading deposits...</div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- PENDING SUBMISSIONS -->
  <!-- ========================= -->

  <div class="section">

    <h2>Pending Worker Submissions</h2>

    <div id="submissions">
      <div class="loading">
        Loading worker submissions...
      </div>
    </div>

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://jfoijwjqfaewzyzjawbw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // ==========================================
  // ADMIN CHECK
  // ==========================================

  async function checkAdmin() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (
      error ||
      !data ||
      !data.session
    ) {

      window.location.href =
        "login.html";

      return;
    }


    const user =
      data.session.user;


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("Moticgigs")
        .select('"Id", email, full_name, role, status')
        .eq("Id", user.id)
        .maybeSingle();


    if (profileError) {

      console.error(profileError);

      showMessage(
        "Could not read administrator profile: " +
        profileError.message,
        "error"
      );

      return;
    }


    if (!profile) {

      showMessage(
        "Administrator profile not found.",
        "error"
      );

      return;
    }


    if (profile.role !== "admin") {

      showMessage(
        "Access denied. Administrator account required.",
        "error"
      );

      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 2000);

      return;
    }


    if (profile.status === "banned") {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

      return;
    }


    document.getElementById("adminInfo").textContent =
      "Logged in as administrator: " +
      (profile.full_name || profile.email);


    // Load both sections
    await loadDeposits();

    await loadSubmissions();

  }


  // ==========================================
  // LOAD DEPOSITS
  // ==========================================

  async function loadDeposits() {

    const container =
      document.getElementById("deposits");


    container.innerHTML =
      '<div class="loading">Loading deposits...</div>';


    const {
      data: deposits,
      error
    } =
      await supabaseClient
        .from("Deposit")
        .select("*")
        .eq("status", "PENDING")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML = "";

      showMessage(
        "Could not load deposits: " +
        error.message,
        "error"
      );

      return;
    }


    if (!deposits || deposits.length === 0) {

      container.innerHTML =
        '<div class="empty">No pending deposits.</div>';

      return;
    }


    container.innerHTML = "";


    deposits.forEach(deposit => {

      const depositId =
        deposit.id;


      const card =
        document.createElement("div");

      card.className = "card";


      card.innerHTML = `

        <p class="amount">
          ₦${Number(deposit.amount || 0).toLocaleString()}
        </p>

        <p>
          <strong>Sender:</strong>
          ${escapeHtml(deposit.sender_name || "N/A")}
        </p>

        <p>
          <strong>Payment Method:</strong>
          ${escapeHtml(deposit.payment_method || "N/A")}
        </p>

        <p>
          <strong>Reference:</strong>
          ${escapeHtml(deposit.payment_reference || "N/A")}
        </p>

        <p>
          <strong>User ID:</strong>
          ${escapeHtml(deposit.user_id || "N/A")}
        </p>

        <p>
          <strong>Submitted:</strong>
          ${deposit.created_at
            ? new Date(deposit.created_at).toLocaleString()
            : "N/A"}
        </p>

        <div class="buttons">

          <button
            class="action approve"
            id="approveDeposit-${depositId}">
            Approve Deposit
          </button>

        </div>

      `;


      container.appendChild(card);


      document
        .getElementById(
          "approveDeposit-" + depositId
        )
        .addEventListener(
          "click",
          () => approveDeposit(depositId)
        );

    });

  }


  // ==========================================
  // APPROVE DEPOSIT
  // ==========================================

  async function approveDeposit(id) {

    if (!id) {

      showMessage(
        "Deposit ID is missing.",
        "error"
      );

      return;
    }


    if (
      !confirm(
        "Approve this deposit?\n\n" +
        "The amount will automatically be added to the advertiser's available balance."
      )
    ) {

      return;
    }


    const button =
      document.getElementById(
        "approveDeposit-" + id
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        "Approving...";

    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "approve_deposit",
        {
          deposit_id: id
        }
      );


    if (error) {

      console.error(error);

      if (button) {

        button.disabled = false;

        button.textContent =
          "Approve Deposit";

      }

      showMessage(
        "Could not approve deposit: " +
        error.message,
        "error"
      );

      return;
    }


    console.log(
      "Deposit approved:",
      data
    );


    showMessage(
      "Deposit approved. The advertiser balance has been credited.",
      "success"
    );


    await loadDeposits();

  }


  // ==========================================
  // LOAD PENDING SUBMISSIONS
  // ==========================================

  async function loadSubmissions() {

    const container =
      document.getElementById("submissions");


    container.innerHTML =
      '<div class="loading">Loading worker submissions...</div>';


    const {
      data: submissions,
      error
    } =
      await supabaseClient
        .from("Submission")
        .select("*")
        .eq("status", "PENDING")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML = "";

      showMessage(
        "Could not load submissions: " +
        error.message,
        "error"
      );

      return;
    }


    if (
      !submissions ||
      submissions.length === 0
    ) {

      container.innerHTML =
        '<div class="empty">No pending worker submissions.</div>';

      return;
    }


    container.innerHTML = "";


    for (const submission of submissions) {

      await createSubmissionCard(
        submission,
        container
      );

    }

  }


  // ==========================================
  // CREATE SUBMISSION CARD
  // ==========================================

  async function createSubmissionCard(
    submission,
    container
  ) {

    const card =
      document.createElement("div");

    card.className =
      "card";


    let task = null;


    if (submission.task_id) {

      const {
        data: taskData
      } =
        await supabaseClient
          .from("Task")
          .select(
            "id, platform, task_type, task_link, quantity, completed_quantity"
          )
          .eq("id", submission.task_id)
          .maybeSingle();


      task = taskData;

    }


    let proofUrl = null;


    // ------------------------------------------
    // Get temporary URL for private proof image
    // ------------------------------------------

    if (submission.proof) {

      let proofPath =
        submission.proof;


      // If proof was stored as a full public URL,
      // don't attempt signed URL.
      if (
        proofPath.startsWith("http://") ||
        proofPath.startsWith("https://")
      ) {

        proofUrl =
          proofPath;

      } else {

        const {
          data: signedData,
          error: signedError
        } =
          await supabaseClient.storage
            .from("task-proofs")
            .createSignedUrl(
              proofPath,
              3600
            );


        if (!signedError && signedData) {

          proofUrl =
            signedData.signedUrl;

        }

      }

    }


    card.innerHTML = `

      <p class="amount">
        Worker Reward:
        ₦${Number(
          submission.reward || 0
        ).toLocaleString()}
      </p>

      <p>
        <strong>Worker Username:</strong>
        ${escapeHtml(
          submission.username || "N/A"
        )}
      </p>

      <p>
        <strong>Worker ID:</strong>
        ${escapeHtml(
          submission.worker_id || "N/A"
        )}
      </p>

      <p>
        <strong>Platform:</strong>
        <span class="tag">
          ${escapeHtml(
            task?.platform || "N/A"
          )}
        </span>
      </p>

      <p>
        <strong>Task:</strong>
        ${escapeHtml(
          task?.task_type || "N/A"
        )}
      </p>

      <p>
        <strong>Task Link:</strong>
        ${
          task?.task_link
          ? `
            <a
              class="task-link"
              href="${escapeHtml(task.task_link)}"
              target="_blank"
              rel="noopener noreferrer">
              Open Task
            </a>
          `
          : "N/A"
        }
      </p>

      <p>
        <strong>Submitted:</strong>
        ${
          submission.created_at
          ? new Date(
              submission.created_at
            ).toLocaleString()
          : "N/A"
        }
      </p>

      ${
        task
        ? `
          <p>
            <strong>Task Progress:</strong>
            ${Number(task.completed_quantity || 0)}
            /
            ${Number(task.quantity || 0)}
          </p>
        `
        : ""
      }

      <p>
        <strong>Proof:</strong>
      </p>

      ${
        proofUrl
        ? `
          <a
            href="${escapeHtml(proofUrl)}"
            target="_blank"
            rel="noopener noreferrer">

            <img
              class="proof"
              src="${escapeHtml(proofUrl)}"
              alt="Worker task proof">
          </a>
        `
        : `
          <p>
            No proof image available.
          </p>
        `
      }

      <input
        type="text"
        class="note-input"
        id="note-${submission.id}"
        placeholder="Optional rejection reason">

      <div class="buttons">

        <button
          class="action approve"
          id="approveSubmission-${submission.id}">
          Approve Submission
        </button>

        <button
          class="action reject"
          id="rejectSubmission-${submission.id}">
          Reject Submission
        </button>

      </div>

    `;


    container.appendChild(card);


    document
      .getElementById(
        "approveSubmission-" +
        submission.id
      )
      .addEventListener(
        "click",
        () =>
          approveSubmission(
            submission.id
          )
      );


    document
      .getElementById(
        "rejectSubmission-" +
        submission.id
      )
      .addEventListener(
        "click",
        () =>
          rejectSubmission(
            submission.id
          )
      );

  }


  // ==========================================
  // APPROVE WORKER SUBMISSION
  // ==========================================

  async function approveSubmission(id) {

    if (!id) {

      showMessage(
        "Submission ID is missing.",
        "error"
      );

      return;
    }


    if (
      !confirm(
        "Approve this worker submission?\n\n" +
        "The reward will move from the worker's Pending Balance to Available Balance."
      )
    ) {

      return;
    }


    const button =
      document.getElementById(
        "approveSubmission-" + id
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        "Approving...";

    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "approve_submission",
        {
          p_submission_id: id
        }
      );


    if (error) {

      console.error(error);

      if (button) {

        button.disabled = false;

        button.textContent =
          "Approve Submission";

      }

      showMessage(
        "Could not approve submission: " +
        error.message,
        "error"
      );

      return;
    }


    console.log(
      "Submission approved:",
      data
    );


    showMessage(
      "Submission approved. The worker's reward has been moved to Available Balance.",
      "success"
    );


    await loadSubmissions();

  }


  // ==========================================
  // REJECT WORKER SUBMISSION
  // ==========================================

  async function rejectSubmission(id) {

    if (!id) {

      showMessage(
        "Submission ID is missing.",
        "error"
      );

      return;
    }


    const noteInput =
      document.getElementById(
        "note-" + id
      );


    const note =
      noteInput
      ? noteInput.value.trim()
      : "";


    if (
      !confirm(
        "Reject this worker submission?\n\n" +
        "The reward will be removed from the worker's Pending Balance."
      )
    ) {

      return;
    }


    const button =
      document.getElementById(
        "rejectSubmission-" + id
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        "Rejecting...";

    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "reject_submission",
        {
          p_submission_id: id,
          p_rejection_note: note || null
        }
      );


    if (error) {

      console.error(error);

      if (button) {

        button.disabled = false;

        button.textContent =
          "Reject Submission";

      }

      showMessage(
        "Could not reject submission: " +
        error.message,
        "error"
      );

      return;
    }


    console.log(
      "Submission rejected:",
      data
    );


    showMessage(
      "Submission rejected. The reward has been removed from Pending Balance.",
      "success"
    );


    await loadSubmissions();

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

  }


  // ==========================================
  // START
  // ==========================================

  checkAdmin();

</script>

</body>
  </html>

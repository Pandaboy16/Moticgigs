<!DOCTYPE html>

      padding: 10px 14px;

<header>

<!-- IMAGE MODAL -->

<div
  id="imageModal"
  class="modal"
  onclick="closeImageModal()">

  <span class="close-modal">&times;</span>

  <img
    id="modalImage"
    src=""
    alt="Proof">

</div>


<script>

const SUPABASE_URL =
  "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   BASIC HELPERS
===================================================== */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatMoney(value) {

  const number = Number(value || 0);

  return "₦" + number.toLocaleString(
    "en-NG",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );
}


function formatDate(value) {

  if (!value) {
    return "N/A";
  }

  try {

    return new Date(value).toLocaleString(
      "en-NG",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  } catch {

    return value;
  }
}


/* =====================================================
   ADMIN AUTH CHECK
===================================================== */

async function checkAdmin() {

  const status =
    document.getElementById("adminStatus");

  const systemStatus =
    document.getElementById("systemStatus");

  try {

    status.textContent =
      "Checking administrator...";

    systemStatus.textContent =
      "Checking logged-in account...";


    /* STEP 1 */

    const {
      data: userData,
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {

      throw new Error(
        "Authentication error: " +
        userError.message
      );
    }


    if (!userData || !userData.user) {

      status.textContent =
        "Not logged in";

      systemStatus.innerHTML =
        '<span class="status-error">❌ No logged-in user found.</span>';

      return;
    }


    const user =
      userData.user;


    /* STEP 2 */

    systemStatus.textContent =
      "Checking administrator profile...";


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("Moticgigs")
        .select("role, status, email")
        .eq("Id", user.id)
        .single();


    if (profileError) {

      throw new Error(
        "Moticgigs profile error: " +
        profileError.message
      );
    }


    if (!profile) {

      throw new Error(
        "No Moticgigs profile found."
      );
    }


    /* STEP 3 */

    if (profile.role !== "admin") {

      status.textContent =
        "Not an administrator";

      systemStatus.innerHTML =
        '<span class="status-error">❌ This account does not have administrator permission.</span>';

      return;
    }


    if (profile.status !== "active") {

      status.textContent =
        "Administrator account inactive";

      systemStatus.innerHTML =
        '<span class="status-error">❌ Administrator account is not active.</span>';

      return;
    }


    /* SUCCESS */

    status.textContent =
      "Active administrator";

    systemStatus.innerHTML =
      '<span class="status-ok">✅ Administrator authenticated successfully.</span>';


    /*
      IMPORTANT:
      Each section is loaded separately.
      If one fails, the others can still work.
    */

    loadDeposits();
    loadWithdrawals();
    loadSubmissions();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Admin check failed";

    systemStatus.innerHTML =
      '<div class="error">❌ ' +
      escapeHtml(error.message) +
      '</div>';
  }
}


/* =====================================================
   DEPOSITS
===================================================== */

async function loadDeposits() {

  const container =
    document.getElementById("depositList");

  container.innerHTML =
    '<div class="loading">Loading deposits...</div>';


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("Deposit")
        .select("*")
        .eq("status", "PENDING")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      throw error;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No pending deposits.</div>';

      return;
    }


    container.innerHTML = "";


    data.forEach(deposit => {

      const card =
        document.createElement("div");

      card.className = "card";


      card.innerHTML = `

        <div class="amount">
          ${formatMoney(deposit.amount)}
        </div>

        <div class="row">
          <span class="label">User ID:</span>
          ${escapeHtml(deposit.user_id)}
        </div>

        <div class="row">
          <span class="label">Sender Name:</span>
          ${escapeHtml(deposit.sender_name || "N/A")}
        </div>

        <div class="row">
          <span class="label">Payment Method:</span>
          ${escapeHtml(deposit.payment_method || "N/A")}
        </div>

        <div class="row">
          <span class="label">Payment Reference:</span>
          ${escapeHtml(deposit.payment_reference || "N/A")}
        </div>

        <div class="row">
          <span class="label">Created:</span>
          ${formatDate(deposit.created_at)}
        </div>

        <div class="row">
          <span class="label">Expires:</span>
          ${formatDate(deposit.expires_at)}
        </div>

        <button
          class="action approve"
          onclick="approveDeposit('${deposit.id}')">
          ✅ Approve
        </button>

        <button
          class="action reject"
          onclick="rejectDeposit('${deposit.id}')">
          ❌ Reject
        </button>

      `;


      container.appendChild(card);

    });

  }

  catch (error) {

    console.error("Deposit error:", error);

    container.innerHTML =
      '<div class="error">❌ Could not load deposits:\n' +
      escapeHtml(error.message) +
      '</div>';
  }
}


/* =====================================================
   APPROVE DEPOSIT
===================================================== */

async function approveDeposit(id) {

  if (!confirm(
    "Approve this deposit?\n\nThe amount will be added to the advertiser's available posting balance."
  )) {

    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient.rpc(
        "approve_deposit",
        {
          deposit_id: id
        }
      );


    if (error) {

      throw error;
    }


    alert(
      "Deposit approved successfully."
    );


    loadDeposits();

  }

  catch (error) {

    alert(
      "Could not approve deposit:\n\n" +
      error.message
    );

  }
}


/* =====================================================
   REJECT DEPOSIT
===================================================== */

async function rejectDeposit(id) {

  const note =
    prompt(
      "Enter rejection reason:"
    );


  if (note === null) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient.rpc(
        "reject_deposit",
        {
          p_deposit_id: id,
          p_admin_note: note
        }
      );


    if (error) {

      throw error;
    }


    alert(
      "Deposit rejected."
    );


    loadDeposits();

  }

  catch (error) {

    alert(
      "Could not reject deposit:\n\n" +
      error.message
    );

  }
}


/* =====================================================
   WITHDRAWALS
===================================================== */

async function loadWithdrawals() {

  const container =
    document.getElementById(

    );


  container.innerHTML =
    '<div class="loading">Loading withdrawals...</div>';


  try {

    const {

        });

      throw error;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No pending withdrawals.</div>';

      return;
    }


    container.innerHTML = "";


    data.forEach(withdrawal => {

      const card =
        document.createElement("div");

      card.className = "card";


      card.innerHTML = `

        <div class="amount">
          ${formatMoney(withdrawal.amount)}
        </div>

        <div class="row">
          <span class="label">Worker ID:</span>
          ${escapeHtml(withdrawal.worker_id)}
        </div>

        <div class="row">
          <span class="label">Bank:</span>
          ${escapeHtml(withdrawal.bank_name || "N/A")}
        </div>

        <div class="row">
          <span class="label">Account Number:</span>
          ${escapeHtml(withdrawal.account_number || "N/A")}
        </div>

        <div class="row">
          <span class="label">Account Name:</span>
          ${escapeHtml(withdrawal.account_name || "N/A")}
        </div>

        <div class="row">
          <span class="label">Requested:</span>
          ${formatDate(withdrawal.created_at)}
        </div>

        <button
          class="action approve"
          onclick="approveWithdrawal(
            '${escapeJs(withdrawal.worker_id)}',
            '${escapeJs(withdrawal.created_at)}',
            '${escapeJs(withdrawal.amount)}',
            '${escapeJs(withdrawal.account_number)}'
          )">
          ✅ Approve
        </button>

        <button
          class="action reject"
          onclick="rejectWithdrawal(
            '${escapeJs(withdrawal.worker_id)}',
            '${escapeJs(withdrawal.created_at)}',
            '${escapeJs(withdrawal.amount)}',
            '${escapeJs(withdrawal.account_number)}'
          )">
          ❌ Reject
        </button>

      `;

    });

  }

  catch (error) {

    console.error(
      "Withdrawal error:",
      error

    container.innerHTML =
      '<div class="error">❌ Could not load withdrawals:\n' +
      escapeHtml(error.message) +
      '</div>';
  }
}


/* Escape values used inside onclick */

function escapeJs(value) {

  if (value === null ||
      value === undefined) {

    return "";
  }

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}


/* =====================================================
   APPROVE WITHDRAWAL
===================================================== */

async function approveWithdrawal(
  workerId,
  createdAt,
  amount,
  accountNumber
) {

  if (!confirm(
    "Approve this withdrawal?\n\nConfirm that you have processed the bank transfer."
  )) {

    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient.rpc(
        "approve_withdrawal",
        {
          p_worker_id: workerId,
          p_created_at: createdAt,
          p_amount: Number(amount),
          p_account_number: accountNumber,
          p_provider_reference: null,
          p_admin_note: null
        }
      );


    if (error) {

      throw error;
    }


    alert(
      "Withdrawal approved successfully."
    );


    loadWithdrawals();

  }

  catch (error) {

    alert(
      "Could not approve withdrawal:\n\n" +
      error.message
    );

  }
}

   REJECT WITHDRAWAL
===================================================== */

  createdAt,

  accountNumber
) {

    prompt(

  if (note === null) {

  catch (error) {

    );

  }

          ${formatDate(

        </div>

        <div id="${proofId}">

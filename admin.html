<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MoticGigs Admin Diagnostic</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #159447;
    }

    #status {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
    }

    .success {
      color: #087f23;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .step {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🔧 MoticGigs Admin Diagnostic</h1>

  <div id="status">
    Starting diagnostic...
  </div>
</div>

<script>

const SUPABASE_URL =
  "https://jfoijwjqfaewzyzjawbw.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

const statusBox = document.getElementById("status");

function show(message, type = "") {

  const line = document.createElement("div");

  line.className = "step " + type;

  line.textContent = message;

  statusBox.appendChild(line);
}

async function runDiagnostic() {

  statusBox.innerHTML = "";

  try {

    show("STEP 1: Checking Supabase library...");

    if (!window.supabase) {
      show(
        "❌ Supabase JavaScript library did NOT load.",
        "error"
      );
      return;
    }

    show(
      "✅ Supabase JavaScript library loaded.",
      "success"
    );


    show("STEP 2: Creating Supabase client...");

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    show(
      "✅ Supabase client created.",
      "success"
    );


    show("STEP 3: Checking logged-in user...");

    const {
      data: userData,
      error: userError
    } =
      await supabaseClient.auth.getUser();

    if (userError) {

      show(
        "❌ Auth error: " + userError.message,
        "error"
      );

      return;
    }

    if (!userData || !userData.user) {

      show(
        "❌ NO USER IS CURRENTLY LOGGED IN.",
        "error"
      );

      return;
    }

    const user = userData.user;

    show(
      "✅ Logged-in user found.",
      "success"
    );

    show(
      "User ID: " + user.id
    );

    show(
      "Email: " + (user.email || "No email")
    );


    show("STEP 4: Checking Moticgigs profile...");


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("Moticgigs")
        .select("role, status, email")
        .eq("Id", user.id)
        .single();


    if (profileError) {

      show(
        "❌ Moticgigs profile query failed:",
        "error"
      );

      show(
        profileError.message,
        "error"
      );

      show(
        "Error code: " +
        (profileError.code || "none")
      );

      show(
        "Details: " +
        (profileError.details || "none")
      );

      show(
        "Hint: " +
        (profileError.hint || "none")
      );

      return;
    }


    if (!profile) {

      show(
        "❌ No Moticgigs profile found for this user.",
        "error"
      );

      return;
    }


    show(
      "✅ Moticgigs profile found.",
      "success"
    );

    show(
      "Profile email: " +
      (profile.email || "none")
    );

    show(
      "Role: " +
      (profile.role || "none")
    );

    show(
      "Status: " +
      (profile.status || "none")
    );


    show("STEP 5: Checking administrator permission...");


    if (profile.role !== "admin") {

      show(
        "❌ This account does NOT have admin role.",
        "error"
      );

      return;
    }


    if (profile.status !== "active") {

      show(
        "❌ Admin account is not active.",
        "error"
      );

      return;
    }


    show(
      "✅ ADMIN CHECK PASSED!",
      "success"
    );

    show("");
    show("🎉 Everything required for admin authentication is working.");
    show("The problem is probably in the original admin.html code.");

  }

  catch (error) {

    show(
      "❌ UNEXPECTED ERROR",
      "error"
    );

    show(
      error.message || String(error),
      "error"
    );

    console.error(error);
  }
}


runDiagnostic();

</script>

</body>
</html>

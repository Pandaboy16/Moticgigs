<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - MoticGigs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header button {
      border: none;
      background: #dc2626;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .status,
    .section {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .loading {
      color: #6b7280;
      padding: 10px 0;
    }

    .empty {
      color: #6b7280;
    }

    .card {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .row {
      margin: 7px 0;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    .count {
      background: #111827;
      color: white;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .action {
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    textarea {
      width: 100%;
      min-height: 70px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
    }

    .proof {
      margin-top: 15px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .proof img {
      display: block;
      width: 100%;
      max-width: 450px;
      max-height: 600px;
      object-fit: contain;
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .proof a {
      display: inline-block;
      margin-top: 8px;
      color: #2563eb;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      padding: 15px;
      z-index: 9999;
      overflow: auto;
    }

    .modal-box {
      max-width: 750px;
      margin: 20px auto;
      background: white;
      padding: 15px;
      border-radius: 10px;
    }

    .modal img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      background: #111;
    }

    .close {
      float: right;
      background: #111827;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
    }
  </style>
</head>

<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://jfoijwjqfaewzyzjawbw.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_DPAJewEuko9ejvxwH_5CrA_AZLD9Dn_";

  let supabaseClient;


  // ==========================================
  // START SUPABASE
  // ==========================================

  try {

    if (
      typeof supabase === "undefined"
    ) {

      throw new Error(
        "Supabase JavaScript library did not load."
      );

    }

    supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

  }

  catch (error) {

    showError(
      "Supabase could not start:\n\n" +
      error.message
    );

    document.getElementById(
      "adminStatus"
    ).textContent = "Supabase error";

  }


  // ==========================================
  // ERROR
  // ==========================================

  function showError(message) {

    const box =
      document.getElementById(
        "globalError"
      );

    box.style.display = "block";

    box.textContent = message;

  }


  function clearError() {

    const box =
      document.getElementById(
        "globalError"
      );

    box.style.display = "none";

    box.textContent = "";

  }


  // ==========================================
  // TIMEOUT HELPER
  // ==========================================

  function withTimeout(
    promise,
    milliseconds
  ) {

    return Promise.race([

      promise,

      new Promise((_, reject) => {

        setTimeout(() => {

          reject(
            new Error(
              "Supabase request timed out after " +
              milliseconds +
              " seconds."
            )
          );

        }, milliseconds);

      })

    ]);

  }


  // ==========================================
  // CHECK ADMIN
  // ==========================================

  async function checkAdmin() {

    try {

      clearError();

      const status =
        document.getElementById(
          "adminStatus"
        );


      status.textContent =
        "Checking Supabase session...";


      if (!supabaseClient) {

        throw new Error(
          "Supabase client was not created."
        );

      }


      // IMPORTANT:
      // Use getSession instead of getUser.
      const sessionResult =
        await withTimeout(
          supabaseClient.auth.getSession(),
          8000
        );


      if (sessionResult.error) {

        throw sessionResult.error;

      }


      const session =
        sessionResult.data.session;


      if (!session) {

        status.textContent =
          "No login session";

        showError(
          "There is no active Supabase login session on this page.\n\n" +
          "Please log out, log in again with the admin account, and open admin.html."
        );

        return;

      }


      const user =
        session.user;


      status.textContent =
        "Checking administrator profile...";


      const profileResult =
        await withTimeout(

          supabaseClient
            .from("Moticgigs")
            .select("role,status")
            .eq("Id", user.id)
            .single(),

          8000

        );


      if (profileResult.error) {

        throw profileResult.error;

      }


      const profile =
        profileResult.data;


      if (!profile) {

        throw new Error(
          "No Moticgigs profile exists for this account."
        );

      }


      if (
        profile.role !== "admin"
      ) {

        status.textContent =
          "Access denied";

        showError(
          "This account has role: " +
          profile.role +
          "\n\nExpected role: admin"
        );

        return;

      }


      if (
        profile.status === "banned"
      ) {

        status.textContent =
          "Banned";

        showError(
          "This administrator account is banned."
        );

        return;

      }


      status.textContent =
        "Active administrator";


      // Load all three independently.
      loadDeposits();
      loadWithdrawals();
      loadSubmissions();

    }

    catch (error) {

      console.error(
        "ADMIN CHECK ERROR:",
        error
      );

      document.getElementById(
        "adminStatus"
      ).textContent =
        "Error";

      showError(
        "ADMIN CHECK ERROR:\n\n" +
        (error.message ||
         JSON.stringify(error))
      );

    }

  }


  // ==========================================
  // DEPOSITS
  // ==========================================

  async function loadDeposits() {

    const box =
      document.getElementById(
        "deposits"
      );

    box.innerHTML =
      '<div class="loading">Loading deposits...</div>';


    try {

      const result =
        await supabaseClient
          .from("Deposit")
          .select("*")
          .eq("status", "PENDING")
          .order("created_at", {
            ascending: false
          });


      if (result.error) {
        throw result.error;
      }


      const rows =
        result.data || [];


      document.getElementById(
        "depositCount"
      ).textContent =
        rows.length;


      if (!rows.length) {

        box.innerHTML =
          '<div class="empty">No pending deposits.</div>';

        return;

      }


      box.innerHTML = "";


      rows.forEach(deposit => {

        const card =
          document.createElement(
            "div"
          );

        card.className = "card";


        card.innerHTML = `

          <div class="row">
            <span class="label">Amount:</span>
            ₦${Number(
              deposit.amount || 0
            ).toLocaleString()}
          </div>

          <div class="row">
            <span class="label">Sender:</span>
            ${safe(
              deposit.sender_name
            )}
          </div>

          <div class="row">
            <span class="label">Reference:</span>
            ${safe(
              deposit.payment_reference
            )}
          </div>

          <div class="row">
            <span class="label">Method:</span>
            ${safe(
              deposit.payment_method
            )}
          </div>

          <textarea
            id="depositNote_${deposit.id}"
            placeholder="Admin note"
          ></textarea>

          <div class="buttons">

            <button
              class="action approve"
              onclick="approveDeposit('${deposit.id}')"
            >
              Approve
            </button>

            <button
              class="action reject"
              onclick="rejectDeposit('${deposit.id}')"
            >
              Reject
            </button>

          </div>

        `;


        box.appendChild(card);

      });

    }

    catch (error) {

      box.innerHTML =
        '<div class="error" style="display:block">' +
        safe(
          error.message
        ) +
        '</div>';

    }

  }


  // ==========================================
  // APPROVE DEPOSIT
  // ==========================================

  async function approveDeposit(id) {

    if (
      !confirm(
        "Approve this deposit?"
      )
    ) {
      return;
    }


    try {

      const result =
        await supabaseClient.rpc(
          "approve_deposit",
          {
            deposit_id: id
          }
        );


      if (result.error) {
        throw result.error;
      }


      alert(
        "Deposit approved successfully."
      );


      loadDeposits();

    }

    catch (error) {

      alert(
        "Approve failed:\n\n" +
        error.message
      );

    }

  }


  // ==========================================
  // REJECT DEPOSIT
  // ==========================================

  async function rejectDeposit(id) {

    if (
      !confirm(
        "Reject this deposit?"
      )
    ) {
      return;
    }


    const note =
      document.getElementById(
        "depositNote_" + id
      )?.value || "";


    try {

      const result =
        await supabaseClient.rpc(
          "reject_deposit",
          {
            p_deposit_id: id,
            p_admin_note: note
          }
        );


      if (result.error) {
        throw result.error;
      }


      alert(
        "Deposit rejected."
      );


      loadDeposits();

    }

    catch (error) {

      alert(
        "Reject failed:\n\n" +
        error.message
      );

    }

  }

      !confirm(
        "Approve this withdrawal?"

      return;
    }


    try {

      const result =
        await supabaseClient.rpc(
          "approve_withdrawal",
          {
            p_worker_id: workerId,
            p_created_at: createdAt,
            p_amount: Number(amount),
            p_account_number: accountNumber,
            p_provider_reference: null,
            p_admin_note: null

      if (result.error) {

      }


      alert(
        "Withdrawal approved."
      );


      loadWithdrawals();

    }

    catch (error) {

      alert(
        "Approve withdrawal failed:\n\n" +
        error.message

    createdAt,

  ) {

      return;

    try {

      const result =
        await supabaseClient.rpc(
          "reject_withdrawal",

            p_worker_id: workerId,
            p_created_at: createdAt,

            p_provider_reference: null,

        error.message
      );

    }

  }
